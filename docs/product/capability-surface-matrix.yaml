capabilities:
  - id: admin.content.preparation
    area: content
    classification: admin_manageable
    surface: ContentOperations / ContentPreparationWizard / ContentPreparationRequests / ContentReviewQueue
    status: present
    notes: Preparation request discovery and workflow surfaced by PR #178; Issue #182 adds a discoverable lifecycle hub without weakening Backend gates.
  - id: admin.content.operations
    area: content
    classification: admin_manageable
    surface: ContentOperations
    status: present
    notes: Integrated by PR #201. Guided lifecycle entry point with KPI summary links Academic Track, Preparation, Ingestion/Processing, Rights, Review/Publish, exception triage and traceability while preserving Backend authority.
  - id: admin.content.rights
    area: content
    classification: admin_manageable
    surface: ContentRightsReview
    status: present
  - id: admin.content.upload_ingestion
    area: content
    classification: admin_manageable
    surface: ContentIngestionOperations / ContentPreparationWizard
    status: present
    notes: Integrated by PR #201. Returned-ZIP import state, processing checkpoint, attempts and safe error codes are visible; retry is limited to the existing authorized dry-run and upload stays bound to originating Preparation Requests.
  - id: admin.content.review_exceptions
    area: content
    classification: admin_manageable
    surface: ContentReviewExceptions
    status: present
    notes: Integrated by PR #201. Triage is derived from persisted operation failure/block state, rights review status, review decisions and deterministic dry-run blocking codes and routes to existing authorized mutation surfaces.
  - id: admin.content.traceability_versions
    area: content
    classification: read_only_operational
    surface: ContentTraceability
    status: present
    notes: Integrated by PR #201. Read-only request/archive/content/dry-run hash linkage, rights evidence reference, review/publication state, canonical lesson/question/quiz versions and preparation supersession history.
  - id: admin.content.processing_policy
    area: content
    classification: read_only_operational
    surface: ContentOperations
    status: present
    notes: Integrated by PR #201. Backend does not select a preparation provider. The deterministic request/bundle and returned-ZIP contract requires paid_ai_required=false even when optional paid-AI runtime capability is enabled; archive validation and rights/review gates remain Backend-authoritative.
  - id: admin.content.curriculum_coverage
    area: content
    classification: read_only_operational
    surface: ContentOperations
    status: present
    notes: Integrated by PR #201. Coverage is reported as canonical counts for tracks, curriculum nodes and nodes with lessons/questions/quizzes; no synthetic quality or completeness score is invented.
  - id: admin.content.automated_confidence
    area: content
    classification: deferred_disabled
    surface: ContentReviewExceptions (read-only status)
    status: backend_contract_missing
    notes: No Backend confidence-scoring contract exists. Operators see real validation/dry-run/review signals only; no synthetic confidence score is invented.
  - id: admin.curriculum.rebuild
    area: content
    classification: deferred_disabled
    surface: ContentTraceability (read-only status)
    status: backend_contract_missing
    notes: Current Backend implements deterministic dry-run diff, versioned canonical content and supersession protection but no approved curriculum rebuild preview/execution/rollback service. No fake action is exposed.
  - id: admin.content.official_video
    area: content
    classification: deferred_disabled
    surface: null
    status: not_implemented_or_activated
    notes: Official educational video management is not implemented/activated in the current P0 Backend and remains unavailable.
  - id: admin.content.past_papers
    area: content
    classification: deferred_disabled
    surface: null
    status: not_implemented_or_activated
    notes: Past-paper management has no activated P0 Backend contract and remains unavailable rather than being represented by a fake Admin route.
  - id: admin.academic.catalogue
    area: academic
    classification: admin_manageable
    surface: AcademicCatalogue
    status: present
    notes: Admin-only create/list/search/filter/edit for unreferenced tracks, preparation-request scope prefill, immutable audit history, and conservative history locking for referenced tracks. Values must be owner-approved; no board/syllabus/version values are fabricated.
  - id: student.academic.track_change
    area: academic
    classification: user_facing
    surface: Student Web / Academic Track workspace / AcademicTrackSelector
    status: present_on_issue_208_branch
    notes: A first-class Student navigation destination shows the current context and Backend-authorized track catalogue, then reuses the existing explicit activate/reset confirmation flow. Prior attempts/progress remain archived, no mastery or answers migrate across tracks, and track IDs are never typed by the learner.
  - id: admin.system.settings
    area: operations
    classification: admin_manageable
    surface: SystemSettingsRegistry
    status: present
    notes: Integrated by PR #198. Typed non-secret settings with environment scope, optimistic locking, immutable audit history and restore-as-new-version semantics. Secret keys are outside the registry allowlist.
  - id: admin.auth.providers
    area: auth
    classification: admin_manageable
    surface: AuthenticationProviders / SystemSettingsRegistry
    status: present
    notes: Integrated by PR #198. Email/Password, Google and Apple expose enablement, safe references and Set/Not Set secret state. Google/Apple remain fail-closed while the repository verifier adapter is pending; plaintext secrets are never returned.
  - id: admin.notifications.settings
    area: notifications
    classification: admin_manageable
    surface: NotificationSettings / SystemSettingsRegistry
    status: present
    notes: Integrated by PR #198. Global enablement and quiet-hours policy are versioned/audited. Implemented verification/recovery email channels are distinguished from still-audited Student Notification Center scope.
  - id: student.notifications.center
    area: notifications
    classification: user_facing
    surface: contract-defined Notification Center
    status: audit_required
  - id: admin.firebase.integration
    area: integrations
    classification: admin_manageable
    surface: FirebaseRuntimeIntegrations / SystemSettingsRegistry
    status: present
    notes: Integrated by PR #198. Safe project/app references, credential Set/Not Set state, FCM/Remote Config enablement and a controlled test-target boundary are surfaced. No network send is claimed while the Firebase transport adapter is pending. Firebase remains auxiliary and secrets stay external.
  - id: admin.ads.control
    area: safety
    classification: admin_manageable
    surface: AdvertisingSafetyControls / SystemSettingsRegistry
    status: present
    notes: Integrated by PR #198. The operator switch is an additional kill switch only. It can make the Backend policy more restrictive but can never weaken immutable no-ad, age, consent, placement or policy gates.
  - id: safety.ads.no_ad_zones
    area: safety
    classification: internal_non_editable
    surface: AdvertisingSafetyControls read-only / Backend policy tests
    status: present
    notes: Account, assessment, help, lesson, onboarding and progress remain immutable no-ad zones with no Admin edit control.
  - id: assessment.authoritative_randomization
    area: assessment
    classification: internal_non_editable
    surface: Backend authority/tests
    status: present
