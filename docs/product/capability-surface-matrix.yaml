capabilities:
  - id: admin.content.preparation
    area: content
    classification: admin_manageable
    surface: ContentOperations / ContentPreparationWizard / ContentPreparationRequests / ContentReviewQueue
    status: present
    notes: Preparation request discovery and workflow surfaced by PR #178; Issue #182 adds a discoverable lifecycle hub without weakening Backend gates.
  - id: admin.content.operations
    area: content
    classification: admin_manageable
    surface: ContentOperations
    status: present
    notes: Integrated by PR #201. Guided lifecycle entry point with KPI summary links Academic Track, Preparation, Ingestion/Processing, Rights, Review/Publish, exception triage and traceability while preserving Backend authority.
  - id: admin.content.rights
    area: content
    classification: admin_manageable
    surface: ContentRightsReview
    status: present
  - id: admin.content.upload_ingestion
    area: content
    classification: admin_manageable
    surface: ContentIngestionOperations / ContentPreparationWizard
    status: present
    notes: Integrated by PR #201. Returned-ZIP import state, processing checkpoint, attempts and safe error codes are visible; retry is limited to the existing authorized dry-run and upload stays bound to originating Preparation Requests.
  - id: admin.content.review_exceptions
    area: content
    classification: admin_manageable
    surface: ContentReviewExceptions
    status: present
    notes: Integrated by PR #201. Triage is derived from persisted operation failure/block state, rights review status, review decisions and deterministic dry-run blocking codes and routes to existing authorized mutation surfaces.
  - id: admin.content.traceability_versions
    area: content
    classification: read_only_operational
    surface: ContentTraceability
    status: present
    notes: Integrated by PR #201. Read-only request/archive/content/dry-run hash linkage, rights evidence reference, review/publication state, canonical lesson/question/quiz versions and preparation supersession history.
  - id: admin.content.processing_policy
    area: content
    classification: read_only_operational
    surface: ContentOperations
    status: present
    notes: Integrated by PR #201. Backend does not select a preparation provider. The deterministic request/bundle and returned-ZIP contract requires paid_ai_required=false even when optional paid-AI runtime capability is enabled; archive validation and rights/review gates remain Backend-authoritative.
  - id: admin.content.curriculum_coverage
    area: content
    classification: read_only_operational
    surface: ContentOperations
    status: present
    notes: Integrated by PR #201. Coverage is reported as canonical counts for tracks, curriculum nodes and nodes with lessons/questions/quizzes; no synthetic quality or completeness score is invented.
  - id: admin.content.automated_confidence
    area: content
    classification: deferred_disabled
    surface: ContentReviewExceptions (read-only status)
    status: backend_contract_missing
    notes: No Backend confidence-scoring contract exists. Operators see real validation/dry-run/review signals only; no synthetic confidence score is invented.
  - id: admin.curriculum.rebuild
    area: content
    classification: deferred_disabled
    surface: ContentTraceability (read-only status)
    status: backend_contract_missing
    notes: Current Backend implements deterministic dry-run diff, versioned canonical content and supersession protection but no approved curriculum rebuild preview/execution/rollback service. No fake action is exposed.
  - id: admin.content.official_video
    area: content
    classification: deferred_disabled
    surface: null
    status: not_implemented_or_activated
    notes: Official educational video management is not implemented/activated in the current P0 Backend and remains unavailable.
  - id: admin.content.past_papers
    area: content
    classification: deferred_disabled
    surface: null
    status: not_implemented_or_activated
    notes: Past-paper management has no activated P0 Backend contract and remains unavailable rather than being represented by a fake Admin route.
  - id: admin.academic.catalogue
    area: academic
    classification: admin_manageable
    surface: AcademicCatalogue
    status: present
    notes: Admin-only create/list/search/filter/edit for unreferenced tracks, preparation-request scope prefill, immutable audit history, and conservative history locking for referenced tracks. Values must be owner-approved; no board/syllabus/version values are fabricated.
  - id: admin.academic.track_availability
    area: academic
    classification: admin_manageable
    surface: AcademicTrackAvailability
    status: present
    notes: Issue #307 adds a discoverable Admin-only draft -> published -> retired lifecycle. Publish/retire transitions require an operator reason, persist immutable academic_track_audits before/after evidence, and revalidate server-side. Retiring a track referenced by learner or curriculum history requires explicit confirmation and never deletes historical contexts. Learner catalogue, activate and reset authority remains Backend-owned and fail-closed to published tracks only. AR/EN/FR status and action labels are exposed without raw IDs as normal operator UX.
  - id: student.academic.track_change
    area: academic
    classification: user_facing
    surface: Student Web / Academic Track workspace / AcademicTrackSelector
    status: present
    notes: PR #209 supplied the discoverable reset/archive workspace; owner directive #305 changes catalogue eligibility to learner self-selection by school year. Student Web chooses a year first and automatically shows every display-safe track configured for that year, with no per-user Admin track assignment. Existing explicit activate/reset confirmation, history archival, no mastery/answer migration, and opaque track-ID handling remain authoritative.
  - id: admin.system.settings
    area: operations
    classification: admin_manageable
    surface: SystemSettingsRegistry
    status: present
    notes: Integrated by PR #198. Typed non-secret settings with environment scope, optimistic locking, immutable audit history and restore-as-new-version semantics. Secret keys are outside the registry allowlist.
  - id: admin.auth.providers
    area: auth
    classification: admin_manageable
    surface: AuthenticationProviders / SystemSettingsRegistry
    status: present
    notes: Integrated by PR #198. Email/Password, Google and Apple expose enablement, safe references and Set/Not Set secret state. Google/Apple remain fail-closed while the repository verifier adapter is pending; plaintext secrets are never returned.
  - id: admin.notifications.settings
    area: notifications
    classification: admin_manageable
    surface: NotificationSettings / SystemSettingsRegistry
    status: present
    notes: Integrated by PR #198. Global enablement and quiet-hours policy are versioned/audited. Implemented verification/recovery email channels are distinguished from still-audited Student Notification Center scope.
  - id: student.notifications.center
    area: notifications
    classification: user_facing
    surface: Student Web / Student Mobile Notification Center
    status: present
    notes: Issue #235 adds a Backend-owned first-party inbox with strict own-account list/read/read-all state. Web and Mobile expose discoverable AR/EN/FR loading, empty, offline, error, permission, retry and read/unread UX. Firebase/FCM remains auxiliary; no raw registration token or external delivery authority is claimed.
  - id: admin.firebase.integration
    area: integrations
    classification: admin_manageable
    surface: FirebaseRuntimeIntegrations / SystemSettingsRegistry
    status: present
    notes: Integrated by PR #198. Safe project/app references, credential Set/Not Set state, FCM/Remote Config enablement and a controlled test-target boundary are surfaced. No network send is claimed while the Firebase transport adapter is pending. Firebase remains auxiliary and secrets stay external.
  - id: admin.ads.control
    area: safety
    classification: admin_manageable
    surface: AdvertisingSafetyControls / SystemSettingsRegistry
    status: present
    notes: Integrated by PR #198. The operator switch is an additional kill switch only. It can make the Backend policy more restrictive but can never weaken immutable no-ad, age, consent, placement or policy gates.
  - id: safety.ads.no_ad_zones
    area: safety
    classification: internal_non_editable
    surface: AdvertisingSafetyControls read-only / Backend policy tests
    status: present
    notes: Account, assessment, help, lesson, onboarding and progress remain immutable no-ad zones with no Admin edit control.
  - id: assessment.authoritative_randomization
    area: assessment
    classification: internal_non_editable
    surface: Backend authority/tests / AssessmentOperations read-only boundary
    status: present
    notes: New-attempt seed, selected set/order, resume order and immutable grading snapshots remain Backend-owned and are never operator-editable.
  - id: admin.assessment.question_bank_visibility
    area: assessment
    classification: read_only_operational
    surface: AssessmentQuestionBank
    status: present
    notes: Discoverable AR/EN/FR inspection of prompts, approved answers, explanations, status, content version and quiz membership without exposing attempt authority.
  - id: admin.assessment.catalogue
    area: assessment
    classification: read_only_operational
    surface: AssessmentOperations / AssessmentQuestionBank
    status: present
    notes: Current quiz/practice definitions expose localized title, kind, academic scope, persisted status, blueprint version, membership count and attempt-snapshot impact. No separate exam entity is invented beyond the implemented quizzes contract.
  - id: admin.assessment.question_membership_coverage
    area: assessment
    classification: read_only_operational
    surface: AssessmentQuestionBank / AssessmentOperations
    status: present
    notes: Operators can inspect human-readable quiz membership and question counts. No current Backend Admin mutation service authorizes membership changes, so no UI-only write path is exposed.
  - id: admin.assessment.question_quality_review
    area: assessment
    classification: read_only_operational
    surface: AssessmentQualityReview / AssessmentQuestionBank
    status: present
    notes: Persisted question status, content version, score, assessment metadata, section/difficulty/concept identifiers, explicit option-shuffle safety, membership count and aggregate immutable snapshot usage are visible. No synthetic quality score or student-private answer history is exposed, and no write path is invented.
  - id: admin.assessment.question_lifecycle_management
    area: assessment
    classification: read_only_operational
    surface: AssessmentQuestionBank / AssessmentQualityReview / AssessmentOperations
    status: backend_contract_missing
    notes: Current Backend stores question status but has no operator-authorized service/policy contract for legal lifecycle transitions, stale edit protection and immutable audit evidence. Lifecycle therefore remains read-only.
  - id: admin.assessment.lifecycle_availability
    area: assessment
    classification: read_only_operational
    surface: AssessmentOperations
    status: backend_contract_missing
    notes: Persisted quiz status is visible, but no authoritative Admin service currently defines publish/disable/archive availability transitions with validation, confirmation, reason, optimistic concurrency and audit. No raw Filament table mutation is permitted.
  - id: admin.assessment.blueprint_configuration
    area: assessment
    classification: read_only_operational
    surface: AssessmentOperations
    status: backend_contract_missing
    notes: Persisted blueprint constraints, question-order policy and version are visible together with existing attempt blueprint versions. No operator-authorized versioned mutation contract exists; any future change must apply only according to Backend rules and must never rewrite existing attempt scope/question snapshots.
  - id: admin.assessment.mistake_bank_operations
    area: assessment
    classification: deferred_disabled
    surface: null
    status: backend_contract_missing
    notes: Repository audit found no activated role-safe aggregate mistake-bank operations contract. No broad learner answer/history visibility is created for Admin parity.
  - id: admin.assessment.ai_composition
    area: assessment
    classification: deferred_disabled
    surface: null
    status: not_implemented_or_activated
    notes: No implemented assessment composition proposal/apply contract exists. Optional paid-AI availability does not create Assessment publication authority; no fake provider action is exposed.
  - id: admin.accounts.roles_sessions
    area: auth
    classification: admin_manageable
    surface: AccountOperations
    status: present
    notes: Integrated through Issue #216 / PR #218. Admin-only account discovery and safe account/session status are surfaced with canonical Auth-backed revoke-all security recovery and immutable actor/target/reason/before/after audit. Fixed repository roles remain read-only because no arbitrary permission editor or contract-authorized role mutation exists.
  - id: admin.operations.control_center
    area: operations
    classification: read_only_operational
    surface: OperationsControlCenter
    status: present
    notes: Integrated through Issue #216 / PR #218. Composes database, queue, storage, runtime/outbox and safe integration health with links to existing SystemCapabilities, RuntimeInspector, Settings and authorized recovery surfaces. Scheduler freshness and storage capacity remain explicitly unobservable where no governed contract exists; no shell, SQL or secret editing is introduced.
  - id: admin.public_legal_help.visibility
    area: public
    classification: read_only_operational
    surface: PublicLegalStatus
    status: present
    notes: Issue #224 exposes the existing AR/EN/FR public/help/legal surface, route/template/indexability state and explicit owner/legal blockers without creating edit or publication authority.
  - id: admin.public_legal_help.management
    area: public
    classification: deferred_disabled
    surface: PublicLegalStatus (read-only boundary)
    status: backend_contract_missing
    notes: No approved Backend mutation/version/publication contract exists for legal wording or owner/legal facts. Final entity/controller, jurisdiction, contact, processing, vendor, transfer, retention, age/safety, effective-date and policy-version values remain owner/legal inputs and cannot be fabricated.
  - id: admin.system.capabilities
    area: operations
    classification: read_only_operational
    surface: SystemCapabilities
    status: present
  - id: admin.runtime.inspector
    area: operations
    classification: read_only_operational
    surface: RuntimeInspector
    status: present
  - id: deployment.release_sha
