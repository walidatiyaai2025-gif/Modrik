schema_version: 1.0.0
updated: 2026-08-23
completeness: kickoff_mirror_plus_owner_surface_governance
acceptance_criteria:
  - id: AC-P0-001
    requirement_ids: [REQ-P0-009]
    statement: Domain decisions are enforced by Backend services and policies, not independently reimplemented by clients.
    verification: architecture review and backend contract tests
  - id: AC-P0-002
    requirement_ids: [REQ-P0-005]
    statement: Every new quiz or exam attempt receives a fresh cryptographically secure server-generated seed.
    verification: backend integration test
  - id: AC-P0-003
    requirement_ids: [REQ-P0-005]
    statement: When an attempt has more than one question, authoritative order is non-static; selected sets rotate when the bank and blueprint permit.
    verification: backend property and integration tests
  - id: AC-P0-004
    requirement_ids: [REQ-P0-005]
    statement: Resuming or reconnecting to the same attempt returns the original seed and authoritative order without reshuffling.
    verification: backend integration test
  - id: AC-P0-005
    requirement_ids: [REQ-P0-005]
    statement: A client-supplied seed or question order is rejected or ignored and can never become authoritative.
    verification: API contract and abuse-case tests
  - id: AC-P0-006
    requirement_ids: [REQ-P0-003]
    statement: Only authorized Admin or Content Team roles can publish official curriculum content; UGC cannot be promoted automatically.
    verification: authorization tests and data-model constraints
  - id: AC-P0-007
    requirement_ids: [REQ-P0-004]
    statement: A preparation import must match preparation_request_id, settings_hash, and schema_version from the originating request.
    verification: schema and backend import tests
  - id: AC-P0-008
    requirement_ids: [REQ-P0-004]
    statement: Stale, mismatched, malformed, or corrupt returned packs are rejected before persistent content import.
    verification: golden invalid-fixture tests
  - id: AC-P0-009
    requirement_ids: [REQ-P0-006]
    statement: Offline retries and imports are idempotent and resumable where applicable, and acknowledged answers or progress are not lost.
    verification: retry, replay, conflict, and interrupted-sync tests
  - id: AC-P0-010
    requirement_ids: [REQ-P0-002]
    statement: Changing the active academic track requires the defined reset flow and archives, rather than deletes, historical attempts and mastery.
    verification: domain and persistence tests
  - id: AC-P0-022
    requirement_ids: [REQ-P0-002]
    statement: An authenticated learner can choose a school year and then any display-safe academic track configured for that year without a per-user Admin grant; the student surface refreshes the track choices automatically when the chosen year changes, while fixture tracks remain hidden outside fixture mode.
    verification: backend catalogue/domain tests plus Student Web year-to-track regression coverage
  - id: AC-P0-011
    requirement_ids: [REQ-P0-010]
    statement: Missing or stale age and advertising configuration resolves to ads off for under-13 and unknown users.
    verification: policy default tests
  - id: AC-P0-012
    requirement_ids: [REQ-P0-010]
    statement: Immutable no-ad zones and a backend global kill switch override placement-level advertising settings.
    verification: policy precedence tests
  - id: AC-P0-013
    requirement_ids: [REQ-P0-001]
    statement: Provider linking preserves one user profile and includes verification, recovery, deletion, and session-revocation paths.
    verification: auth integration and security tests
  - id: AC-P0-014
    requirement_ids: [REQ-P0-007, REQ-P0-008, REQ-P0-012]
    statement: Applicable UI states cover AR, EN, FR, RTL, LTR, keyboard and screen-reader access, large text, loading, empty, error, offline, retry, and permission handling.
    verification: automated accessibility checks plus manual test matrix
  - id: AC-P0-015
    requirement_ids: [REQ-P0-013]
    statement: Core study, practice, attempts, and progress work with all paid-AI integrations disabled, and optional AI receives no student PII by default.
    verification: configuration-off integration test and threat-model review
  - id: AC-P0-016
    requirement_ids: [REQ-P0-009, REQ-P0-014]
    statement: Migrations and queries run on MariaDB 10.11 without PostgreSQL-specific JSONB, operators, extensions, sequences, or index syntax.
    verification: MariaDB migration and test job
  - id: AC-P0-017
    requirement_ids: [REQ-P0-014]
    statement: Queued work can use a database driver and cron-compatible bounded workers; long jobs are chunked, resumable, idempotent, and observable.
    verification: operations test and runbook review
  - id: AC-P0-018
    requirement_ids: [REQ-P0-011]
    statement: Unknown owner inputs remain explicit placeholders or blockers and are never fabricated in production configuration or content.
    verification: release-input checklist and repository scan
  - id: AC-P0-019
    requirement_ids: [REQ-P0-011]
    statement: deploy/coming-soon remains dependency-free, truthful, accessible, and releasable until an approved Landing replacement exists.
    verification: static smoke test and controlled release review
  - id: AC-P0-020
    requirement_ids: [REQ-P0-007]
    statement: A clean checkout can install, lint, test, and build Backend and Student Web using pinned toolchains and lockfiles.
    verification: CI clean-checkout jobs
  - id: AC-P0-021
    requirement_ids: [REQ-P0-015]
    statement: Every implemented or configurable capability is represented in the capability-to-surface matrix and is either reachable through a discoverable role-appropriate Admin/user/operational surface or explicitly classified as internal_non_editable or deferred_disabled; required Admin surfaces include navigation/list or settings entry points, RBAC, safe secret handling, applicable audit/confirmation/versioning, localization and failure/degraded states, and automated regression coverage prevents silent removal.
    verification: capability-surface matrix validation, navigation/page tests, RBAC/security review, and cross-surface regression audit

  - id: AC-P0-023
    requirement_ids: [REQ-P0-016]
    statement: Skills are canonical curriculum nodes beneath topics and may own versioned localized learning objectives; Question Bank records may reference those objectives without creating a second curriculum authority.
    verification: migration/schema tests, data-contract review, and MariaDB migration job
  - id: AC-P0-024
    requirement_ids: [REQ-P0-016]
    statement: Question foundation data distinguishes static versus deterministic-template questions and persists difficulty, source/provenance, review state/version and publication metadata while preserving existing immutable attempt snapshots and Backend scoring authority.
    verification: schema/domain contract tests, assessment regression suite, and OpenAPI review
  - id: AC-P0-025
    requirement_ids: [REQ-P0-016]
    statement: Student×Skill mastery state is persisted as a Backend-owned versioned projection bound to user, academic context and skill; no client may author mastery and no #353 foundation code invents the later mastery algorithm.
    verification: migration/schema tests, authorization architecture review, and MariaDB migration job

  - id: AC-P0-026
    requirement_ids: [REQ-P0-017]
    statement: The authoritative assessment runtime supports practice, daily practice, topic/skill practice, weak-skills, revision, mistakes, diagnostic, exam and custom-assignment modes through one attempt engine; adaptive selection inputs remain hooks for #356/#357 rather than a second engine.
    verification: Backend mode-policy and integration tests
  - id: AC-P0-027
    requirement_ids: [REQ-P0-017]
    statement: Attempt snapshots retain question version, skill/objective context, difficulty, generated template instance and reveal/hint policy; answer revisions retain duration and hint telemetry; direct-ID/cross-user access fails closed and in-progress responses never expose grading keys.
    verification: Backend security/runtime tests plus OpenAPI contract
  - id: AC-P0-028
    requirement_ids: [REQ-P0-017]
    statement: Static and arithmetic template questions are scored by Backend-owned deterministic contracts, submit retries reread persisted graded state without duplicate submission effects, and exam/diagnostic hints fail closed.
    verification: deterministic template, retry/idempotency, SQLite and MariaDB tests


  - id: AC-P0-029
    requirement_ids: [REQ-P0-018]
    statement: Learning feature state changes are Admin-only, reasoned, versioned, audited and bounded to the allowlisted enabled/disabled/pilot/admin-only states and safe rollout scopes; invariant security/scoring/privacy/publication controls are absent from the mutable inventory.
    verification: Backend service, Livewire RBAC, stale-version and capability-surface tests
  - id: AC-P0-030
    requirement_ids: [REQ-P0-018]
    statement: Learning jobs expose schedule, availability, pause state, last run/status/duration/counts and next-run evidence; bounded database-backed Run Now records durable run history only for implemented handlers while integrated mastery recalculation is runnable and unmet adaptive/external-delivery dependencies fail closed as blocked_dependency.
    verification: Backend job-control tests, MariaDB migration round-trip and Admin acceptance

  - id: AC-P0-031
    requirement_ids: [REQ-P0-019]
    statement: Identical mastery classification, review outcome, previous interval, timestamp and policy inputs produce the same algorithm version, policy fingerprint, next interval and due timestamp; successful reviews extend from the bounded base interval and never exceed the configured maximum.
    verification: focused Backend unit tests for repeat-input equality, first-success scheduling, successful extension and maximum bounds

  - id: AC-P0-032
    requirement_ids: [REQ-P0-019]
    statement: A lapse resets revision to the configured minimum interval, later success recovers deterministically, unknown mastery classifications or out-of-bounds persisted/policy intervals fail closed, and the scheduler introduces no client scoring/mastery authority, schema mutation or paid-AI runtime dependency.
    verification: focused Backend unit tests for lapse/recovery and fail-closed policy validation plus capability-surface contract validation

  - id: AC-P0-033
    requirement_ids: [REQ-P0-020]
    statement: The canonical Mistake Notebook path is new -> relearning -> review_due -> recovered -> mastered; identical state/event inputs produce the same versioned transition and fingerprint, and a repeated lapse while already relearning is idempotent.
    verification: focused Backend unit tests for the complete recovery path, repeat-input equality and relearning lapse idempotency

  - id: AC-P0-034
    requirement_ids: [REQ-P0-020]
    statement: Lapse from review_due, recovered or mastered deterministically returns the item to relearning, while unknown states/events and illegal transitions fail closed; the lifecycle introduces no persistence/schema mutation, client mastery/scoring authority or paid-AI dependency.
    verification: focused Backend unit tests for lapse recovery and fail-closed illegal transition handling plus capability-surface contract validation

  - id: AC-P0-035
    requirement_ids: [REQ-P0-021]
    statement: Selection is independent of input ordering, prioritizes critical before weak mastery, then lower score, higher confidence, greater evidence and stable Skill identity, and applies the requested result limit only after deterministic sorting.
    verification: focused Backend unit tests for shuffled input, deterministic ties, critical/weak priority and bounded result count

  - id: AC-P0-036
    requirement_ids: [REQ-P0-021]
    statement: Zero-evidence cold-start Skills, developing Skills and strong Skills are not selected as weak/critical candidates; duplicate Skill authority, malformed mastery values and invalid limits fail closed without introducing client mastery/scoring authority, persistence changes or paid-AI dependency.
    verification: focused Backend unit tests for cold-start exclusion, duplicate/integrity failure and malformed state validation plus capability-surface contract validation

  - id: AC-P0-037
    requirement_ids: [REQ-P0-022]
    statement: Tested Skills produce deterministic diagnostic accuracy evidence sorted by stable Skill identity, identical inputs are order-independent, and diagnostic output does not contain or write mastery score/band authority.
    verification: focused Backend unit tests for tested evidence, shuffled input determinism and absence of mastery assignment

  - id: AC-P0-038
    requirement_ids: [REQ-P0-022]
    statement: Zero-answer Skills remain explicitly untested without accuracy or mastery values, while duplicate Skill results and impossible correct/answered counts fail closed.
    verification: focused Backend unit tests for untested-state truthfulness, duplicate detection and malformed count validation plus capability-surface contract validation

  - id: AC-P0-039
    requirement_ids: [REQ-P0-023]
    statement: Identical Daily Plan candidates and limits produce the same selected items and fingerprint independent of input ordering; due revision, recent mistake and weak-Skill sources follow deterministic priority while active subjects are balanced round-by-round and the configured item limit is applied after ordering.
    verification: focused Backend unit tests for shuffled input determinism, source priority, subject balance, bounded selection and repeat fingerprint

  - id: AC-P0-040
    requirement_ids: [REQ-P0-023]
    statement: Candidates with zero available questions are excluded with explicit question_unavailable evidence, insufficient candidates produce degraded or empty status with a shortfall count, and duplicate/contradictory target identity or invalid limits fail closed.
    verification: focused Backend unit tests for unavailable content, degraded/empty state, duplicate target integrity and limit validation plus capability-surface contract validation
