name: Web CSP Hydration Probe

on:
  pull_request:
    paths:
      - "qa/web-e2e/csp-hydration-probe.cjs"
      - ".github/workflows/web-csp-hydration-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hydration-probe:
    name: Current main CSP hydration
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out Issue #108 probe
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: harness

      - name: Check out current main candidate
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          path: target

      - name: Resolve exact candidate provenance
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          echo "observed_sha=$(git -C target rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "harness_sha=$(git -C harness rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: target/apps/web/package-lock.json

      - name: Install Web candidate
        working-directory: target/apps/web
        run: npm ci

      - name: Cache Chromium runtime
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ms-playwright
          key: playwright-1.62.1-chromium-${{ runner.os }}

      - name: Install pinned Playwright runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/playwright" --ignore-scripts --no-save playwright@1.62.1
          PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/ms-playwright" \
            node "$RUNNER_TEMP/playwright/node_modules/playwright/cli.js" install --with-deps chromium

      - name: Build exact current-main production candidate
        env:
          OBSERVED_SHA: ${{ steps.candidate.outputs.observed_sha }}
        working-directory: target/apps/web
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .next
          export MODRIK_RUNTIME_INSPECTOR_ENABLED=false
          export MODRIK_RUNTIME_ENVIRONMENT=production
          export MODRIK_BUILD_VERSION=e2e-hydration
          export MODRIK_GIT_SHA="$OBSERVED_SHA"
          npm run build

      - name: Execute sanitized CSP hydration probe
        env:
          NODE_PATH: ${{ runner.temp }}/playwright/node_modules
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
          MODRIK_E2E_TARGET_DIR: ${{ github.workspace }}/target
          MODRIK_E2E_EVIDENCE_DIR: ${{ github.workspace }}/evidence
          MODRIK_E2E_CANDIDATE: current-main-csp-hydration
          MODRIK_E2E_OBSERVED_SHA: ${{ steps.candidate.outputs.observed_sha }}
        shell: bash
        run: node harness/qa/web-e2e/csp-hydration-probe.cjs

      - name: Write sanitized provenance manifest
        if: always()
        env:
          OBSERVED_SHA: ${{ steps.candidate.outputs.observed_sha }}
          HARNESS_SHA: ${{ steps.candidate.outputs.harness_sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 - <<'PY'
          import json, os, pathlib
          payload = {
              "schema_version": "modrik.web.csp-hydration-manifest.v1",
              "observed_sha": os.environ.get("OBSERVED_SHA") or None,
              "harness_sha": os.environ.get("HARNESS_SHA") or None,
          }
          pathlib.Path("evidence/candidate-manifest.json").write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Upload sanitized hydration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-csp-hydration-current-main
          path: evidence
          if-no-files-found: error
          retention-days: 14
