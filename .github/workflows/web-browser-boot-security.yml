name: Web Browser Boot Security

on:
  pull_request:
    paths:
      - "qa/web-e2e/**"
      - ".github/workflows/web-browser-boot-security.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-browser-boot-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  current-main-boot-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact Issue #108 harness head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: harness

      - name: Check out authoritative current main
        uses: actions/checkout@v4
        with:
          ref: main
          path: target

      - name: Resolve exact provenance
        id: provenance
        shell: bash
        run: |
          set -euo pipefail
          echo "harness_sha=$(git -C harness rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "target_sha=$(git -C target rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: target/apps/web/package-lock.json

      - name: Install Web candidate
        working-directory: target/apps/web
        run: npm ci

      - name: Cache Chromium runtime
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ms-playwright
          key: playwright-1.62.1-chromium-${{ runner.os }}

      - name: Install pinned Playwright runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/playwright" --ignore-scripts --no-save playwright@1.62.1
          PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/ms-playwright" \
            node "$RUNNER_TEMP/playwright/node_modules/playwright/cli.js" install --with-deps chromium

      - name: Build authoritative main Web production artifact
        working-directory: target/apps/web
        run: npm run build

      - name: Execute current-main browser boot security probe
        env:
          NODE_PATH: ${{ runner.temp }}/playwright/node_modules
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
          MODRIK_E2E_TARGET_DIR: ${{ github.workspace }}/target
          MODRIK_E2E_EVIDENCE_DIR: ${{ github.workspace }}/evidence/current-main-boot-security
          MODRIK_E2E_EXPECTED_SHA: ${{ steps.provenance.outputs.target_sha }}
          MODRIK_E2E_HARNESS_SHA: ${{ steps.provenance.outputs.harness_sha }}
        run: node harness/qa/web-e2e/browser-boot-security.cjs

      - name: Upload sanitized boot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-browser-current-main-boot-security
          path: evidence/current-main-boot-security
          if-no-files-found: error
          retention-days: 14
