name: Web CSP Hydration

on:
  pull_request:
    paths:
      - "apps/web/src/app/layout.tsx"
      - "apps/web/src/security-headers.ts"
      - "apps/web/src/security-headers.test.tsx"
      - "apps/web/scripts/csp-hydration-smoke.cjs"
      - ".github/workflows/web-csp-hydration.yml"

permissions:
  contents: read

concurrency:
  group: web-csp-hydration-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  chromium-csp-hydration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Install pinned Chromium runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/playwright" --ignore-scripts --no-save playwright@1.62.1
          PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/ms-playwright" \
            node "$RUNNER_TEMP/playwright/node_modules/playwright/cli.js" install --with-deps chromium

      - name: Build production Web artifact
        working-directory: apps/web
        run: npm run build

      - name: Prove strict CSP and client hydration coexist
        working-directory: apps/web
        env:
          NODE_PATH: ${{ runner.temp }}/playwright/node_modules
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
          MODRIK_CSP_PROBE_URL: http://127.0.0.1:3000/
          MODRIK_API_BASE_URL: http://127.0.0.1:9
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- -H 127.0.0.1 -p 3000 > "$RUNNER_TEMP/modrik-csp-next.log" 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for _ in $(seq 1 80); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ > /dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "Next production server exited before CSP probe readiness" >&2
              exit 1
            fi
            sleep 0.125
          done
          test "$ready" = "1"

          node scripts/csp-hydration-smoke.cjs
