name: TEMP Mastery Pint Diff

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pint-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Install Backend dependencies
        working-directory: apps/backend
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Print Pint-formatted MasteryEngine diff
        working-directory: apps/backend
        run: |
          vendor/bin/pint app/Services/MasteryEngine.php
          git diff -- app/Services/MasteryEngine.php
          test -z "$(git status --porcelain -- app/Services/MasteryEngine.php)"
