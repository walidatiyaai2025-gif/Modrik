name: Bootstrap CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: bootstrap-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run contracts:check
      - run: npm run openapi:lint
      - run: npm run tokens:check
      - run: npm run pilot:smoke:plan

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4.24
          extensions: curl, fileinfo, intl, mbstring, openssl, pdo_sqlite, sqlite3, zip
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer audit --locked --no-interaction
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpstan analyse --memory-limit=1G
      - run: php artisan test

  backend-mariadb:
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: mariadb
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: modrik_test
      DB_USERNAME: modrik_test
      DB_PASSWORD: modrik_test_only
      MODRIK_FIXTURE_MODE: 'true'
      MODRIK_FIXTURE_BEARER_TOKEN: modrik-ci-fixture-token
      MODRIK_IDEMPOTENCY_SECRET: modrik-ci-idempotency-secret
    services:
      mariadb:
        image: mariadb:10.11.18
        env:
          MARIADB_DATABASE: modrik_test
          MARIADB_USER: modrik_test
          MARIADB_PASSWORD: modrik_test_only
          MARIADB_ROOT_PASSWORD: modrik_root_test_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4.24
          extensions: curl, fileinfo, intl, mbstring, openssl, pdo_mysql, zip
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Verify MariaDB 10.11 migration round trip and full Backend suite
        run: bash ../../scripts/verify-mariadb-migration-roundtrip.sh

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate

  required-matrix:
    name: contracts, backend, backend-mariadb, web, mobile, secret-scan
    if: ${{ always() }}
    needs:
      - contracts
      - backend
      - backend-mariadb
      - web
      - mobile
      - secret-scan
      - dependency-review
    runs-on: ubuntu-latest
    steps:
      - name: Require the complete governed CI matrix
        env:
          CONTRACTS_RESULT: ${{ needs.contracts.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          BACKEND_MARIADB_RESULT: ${{ needs.backend-mariadb.result }}
          WEB_RESULT: ${{ needs.web.result }}
          MOBILE_RESULT: ${{ needs.mobile.result }}
          SECRET_SCAN_RESULT: ${{ needs.secret-scan.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
        run: |
          test "$CONTRACTS_RESULT" = "success"
          test "$BACKEND_RESULT" = "success"
          test "$BACKEND_MARIADB_RESULT" = "success"
          test "$WEB_RESULT" = "success"
          test "$MOBILE_RESULT" = "success"
          test "$SECRET_SCAN_RESULT" = "success"
          test "$DEPENDENCY_REVIEW_RESULT" = "success" || test "$DEPENDENCY_REVIEW_RESULT" = "skipped"
