name: Web Browser PR124 Verification

on:
  pull_request:
    paths:
      - ".github/workflows/web-browser-pr124-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth-responsive:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out verification harness
        uses: actions/checkout@v4
        with:
          path: harness

      - name: Check out authoritative main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          path: target

      - name: Compose exact PR 128 candidate
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          git -C target config user.name "MODRIK browser verification"
          git -C target config user.email "browser-verification@users.noreply.github.com"
          git -C target fetch --no-tags origin "+refs/pull/128/head:refs/remotes/origin/pr-128"
          candidate_sha="$(git -C target rev-parse refs/remotes/origin/pr-128)"
          git -C target merge --no-edit --no-ff "$candidate_sha"
          observed_sha="$(git -C target rev-parse HEAD)"
          echo "candidate_sha=$candidate_sha" >> "$GITHUB_OUTPUT"
          echo "observed_sha=$observed_sha" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: target/apps/web/package-lock.json

      - name: Install Web candidate
        working-directory: target/apps/web
        run: npm ci

      - name: Install pinned Chromium runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/playwright" --ignore-scripts --no-save playwright@1.62.1
          PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/ms-playwright" \
            node "$RUNNER_TEMP/playwright/node_modules/playwright/cli.js" install --with-deps chromium

      - name: Build composed candidate
        env:
          OBSERVED_SHA: ${{ steps.candidate.outputs.observed_sha }}
        working-directory: target/apps/web
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .next
          export MODRIK_BUILD_VERSION=e2e
          export MODRIK_GIT_SHA="$OBSERVED_SHA"
          npm run build

      - name: Run unchanged Issue 108 core browser assertions
        env:
          NODE_PATH: ${{ runner.temp }}/playwright/node_modules
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
          MODRIK_E2E_TARGET_DIR: ${{ github.workspace }}/target
          MODRIK_E2E_EVIDENCE_DIR: ${{ github.workspace }}/evidence/pr-128-auth
          MODRIK_E2E_OBSERVED_SHA: ${{ steps.candidate.outputs.observed_sha }}
          MODRIK_E2E_EXPECTED_SHA: ${{ steps.candidate.outputs.observed_sha }}
          MODRIK_E2E_CANDIDATE: pr-128-auth-core
          MODRIK_E2E_PROFILE: core
        shell: bash
        run: node harness/qa/web-e2e/browser-runtime-acceptance.cjs

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-browser-pr128-auth
          path: evidence/pr-128-auth
          if-no-files-found: warn
          retention-days: 14
