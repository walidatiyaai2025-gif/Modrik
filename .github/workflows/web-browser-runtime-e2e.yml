name: Web Browser Runtime Acceptance

on:
  pull_request:
    paths:
      - "qa/web-e2e/**"
      - ".github/workflows/web-browser-runtime-e2e.yml"
      - "docs/qa/P0-WEB-E2E-013-browser-runtime.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-browser-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-runtime:
    name: Browser runtime (${{ matrix.candidate }})
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - candidate: pr-93-session-security
            base_sha: 3f7e97dc9ea82349354163f9cefae2938c06ec32
            merge_shas: ""
            profile: session-security
          - candidate: pr-103-runtime-inspector
            base_sha: 715a690c8f5fc39dd93f7825147dc6f90db41ced
            merge_shas: ""
            profile: inspector
          - candidate: release-gap-web-composite
            base_sha: 715a690c8f5fc39dd93f7825147dc6f90db41ced
            merge_shas: >-
              0ec6f386f1859d675b808630958da64a069d7c75
              1b35e5ae82a1ed87db6901b244db3e0a57847ea0
              294bcec0efc9353f62fc05f49243d9170f3e0e43
              82d0850c659245a120bd3610dc5c97001eb3be1a
              305cf77eae6a8c7fc567e3f77fef7a8a0102d0c0
            profile: composite

    steps:
      - name: Check out Issue #108 harness
        uses: actions/checkout@v4
        with:
          path: harness

      - name: Check out exact browser candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.base_sha }}
          fetch-depth: 0
          path: target

      - name: Verify exact base and compose candidate-only test tree
        id: candidate
        env:
          BASE_SHA: ${{ matrix.base_sha }}
          MERGE_SHAS: ${{ matrix.merge_shas }}
        shell: bash
        run: |
          set -euo pipefail
          actual_base="$(git -C target rev-parse HEAD)"
          test "$actual_base" = "$BASE_SHA"

          if [ -n "${MERGE_SHAS// }" ]; then
            git -C target config user.name "MODRIK browser evidence"
            git -C target config user.email "browser-evidence@users.noreply.github.com"
            for sha in $MERGE_SHAS; do
              git -C target fetch --no-tags origin "$sha"
              git -C target merge --no-edit --no-ff "$sha"
            done
          fi

          observed_sha="$(git -C target rev-parse HEAD)"
          echo "observed_sha=$observed_sha" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: target/apps/web/package-lock.json

      - name: Install and build Web candidate
        working-directory: target/apps/web
        run: |
          npm ci
          npm run build

      - name: Cache Chromium runtime
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ms-playwright
          key: playwright-1.62.1-chromium-${{ runner.os }}

      - name: Install pinned Playwright runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/playwright" --ignore-scripts --no-save playwright@1.62.1
          PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/ms-playwright" \
            node "$RUNNER_TEMP/playwright/node_modules/playwright/cli.js" install --with-deps chromium

      - name: Execute browser runtime acceptance
        env:
          NODE_PATH: ${{ runner.temp }}/playwright/node_modules
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
          MODRIK_E2E_TARGET_DIR: ${{ github.workspace }}/target
          MODRIK_E2E_EVIDENCE_DIR: ${{ github.workspace }}/evidence/${{ matrix.candidate }}
          MODRIK_E2E_CANDIDATE: ${{ matrix.candidate }}
          MODRIK_E2E_PROFILE: ${{ matrix.profile }}
          MODRIK_E2E_EXPECTED_SHA: ${{ matrix.base_sha }}
          MODRIK_E2E_OBSERVED_SHA: ${{ steps.candidate.outputs.observed_sha }}
        run: node harness/qa/web-e2e/browser-runtime-acceptance.cjs

      - name: Upload sanitized browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-browser-runtime-${{ matrix.candidate }}
          path: evidence/${{ matrix.candidate }}
          if-no-files-found: warn
          retention-days: 14
