name: Temporary Pint Probe

on:
  pull_request:
    paths:
      - ".github/workflows/temporary-pint-probe.yml"
      - "apps/backend/app/Services/QuestionBankWorkbenchService.php"
      - "apps/backend/tests/Feature/QuestionBankWorkbenchTest.php"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4.24
          coverage: none
          tools: composer:v2
      - name: Install Backend dependencies
        working-directory: apps/backend
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Format probe
        working-directory: apps/backend
        run: |
          vendor/bin/pint app/Services/QuestionBankWorkbenchService.php tests/Feature/QuestionBankWorkbenchTest.php
          echo "=== PINT DIFF START ==="
          git diff -- app/Services/QuestionBankWorkbenchService.php tests/Feature/QuestionBankWorkbenchTest.php
          echo "=== PINT DIFF END ==="
