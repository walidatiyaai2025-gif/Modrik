name: Deploy MODRIK Demo to cPanel

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DEPLOY to confirm the cPanel deployment
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: modrik-demo-cpanel-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.confirm == 'DEPLOY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FTP_HOST: ftp.50sols.com
      FTP_USER: ${{ secrets.CPANEL_FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.CPANEL_FTP_PASSWORD }}
      BRIDGE_URL: https://50sols.com
      BRIDGE_HOST: 50sols.com
      BRIDGE_ORIGIN_IP: 65.21.208.232
      DEMO_HOST: demo.modrik.org
      API_URL: https://api.demo.modrik.org

    steps:
      - name: Validate deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FTP_USER" || { echo 'Missing secret: CPANEL_FTP_USERNAME' >&2; exit 1; }
          test -n "$FTP_PASSWORD" || { echo 'Missing secret: CPANEL_FTP_PASSWORD' >&2; exit 1; }

      - name: Check out canonical main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Resolve immutable release SHA
        id: release
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4.24
          extensions: curl, fileinfo, intl, mbstring, openssl, pdo_mysql, zip
          coverage: none
          tools: composer:v2

      - name: Install Student Web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Build standalone Student Web
        working-directory: apps/web
        env:
          NEXT_PUBLIC_MODRIK_RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: npm run build

      - name: Install Backend production dependencies
        working-directory: apps/backend
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress --optimize-autoloader

      - name: Assemble verified cPanel package
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          GITHUB_SHA="$RELEASE_SHA" bash scripts/package-demo-cpanel.sh
          PACKAGE_ZIP="$(find .runtime -maxdepth 1 -type f -name 'modrik-demo-cpanel-*.zip' -print -quit)"
          test -n "$PACKAGE_ZIP"
          unzip -t "$PACKAGE_ZIP" >/dev/null
          echo "PACKAGE_ZIP=$PACKAGE_ZIP" >> "$GITHUB_ENV"

      - name: Retain deployment package for audit
        uses: actions/upload-artifact@v4
        with:
          name: modrik-demo-cpanel-deploy-${{ steps.release.outputs.sha }}
          path: ${{ env.PACKAGE_ZIP }}
          if-no-files-found: error
          retention-days: 14

      - name: Install FTPS client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends lftp >/dev/null

      - name: Diagnose public Demo routing
        shell: bash
        run: |
          set -euo pipefail
          public_ips="$(getent ahostsv4 "$DEMO_HOST" 2>/dev/null | awk '{print $1}' | sort -u | paste -sd, - || true)"
          echo "MODRIK_DEMO_PUBLIC_IPV4=${public_ips:-unresolved}"
          echo "MODRIK_DEMO_CPANEL_ORIGIN_IPV4=$BRIDGE_ORIGIN_IP"
          if [[ -n "$public_ips" ]] && printf '%s\n' "$public_ips" | tr ',' '\n' | grep -Fxq "$BRIDGE_ORIGIN_IP"; then
            echo 'MODRIK_DEMO_PUBLIC_DNS_INCLUDES_CPANEL_ORIGIN=true'
          else
            echo 'MODRIK_DEMO_PUBLIC_DNS_INCLUDES_CPANEL_ORIGIN=false'
          fi

      - name: Prepare protected one-shot deployment bridge
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          token="$(openssl rand -hex 32)"
          nonce="$(openssl rand -hex 12)"
          bridge="modrik-deploy-$nonce.php"
          token_file=".modrik-deploy-token-$nonce"
          remote_package=".modrik-deploy-package-$nonce.zip"
          remote_runner=".modrik-deploy-runner-$nonce.sh"
          package_sha="$(sha256sum "$PACKAGE_ZIP" | awk '{print $1}')"
          runner_sha="$(sha256sum deploy/demo/deploy-demo-cpanel-remote.sh | awk '{print $1}')"

          echo "::add-mask::$token"
          printf '%s' "$token" > /tmp/modrik-deploy-token
          cp deploy/demo/deploy-demo-cpanel-remote.sh /tmp/modrik-deploy-runner.sh

          cat > /tmp/modrik-deploy.php <<'PHP'
          <?php
          declare(strict_types=1);

          set_time_limit(300);
          ignore_user_abort(true);
          header('Content-Type: application/json; charset=utf-8');
          header('Cache-Control: no-store');

          $expectedToken = trim((string) @file_get_contents(__DIR__ . '/__TOKEN_FILE__'));
          $providedToken = (string) ($_SERVER['HTTP_X_MODRIK_DEPLOY_TOKEN'] ?? '');
          if ($expectedToken === '' || !hash_equals($expectedToken, $providedToken)) {
              http_response_code(404);
              echo json_encode(['ok' => false]);
              exit;
          }

          $releaseSha = '__RELEASE_SHA__';
          $expectedPackageSha = '__PACKAGE_SHA__';
          $expectedRunnerSha = '__RUNNER_SHA__';
          $originIp = '__BRIDGE_ORIGIN_IP__';
          $home = '/home/solscool';
          $publicHtml = $home . '/public_html';
          $backendRoot = $publicHtml . '/api.demo.modrik.org';
          $package = __DIR__ . '/__REMOTE_PACKAGE__';
          $runner = __DIR__ . '/__REMOTE_RUNNER__';

          try {
              $bridgeRoot = realpath(__DIR__);
              $expectedBridgeRoot = realpath($publicHtml);
              if ($bridgeRoot === false || $expectedBridgeRoot === false || $bridgeRoot !== $expectedBridgeRoot) {
                  throw new RuntimeException('Deployment bridge is not running from the expected cPanel public_html root.');
              }
              if (!is_dir($backendRoot) || !is_file($backendRoot . '/artisan')) {
                  throw new RuntimeException('MODRIK Backend root is unavailable.');
              }
              if (!is_file($package) || !hash_equals($expectedPackageSha, (string) hash_file('sha256', $package))) {
                  throw new RuntimeException('Deployment package is missing or checksum validation failed.');
              }
              if (!is_file($runner) || !hash_equals($expectedRunnerSha, (string) hash_file('sha256', $runner))) {
                  throw new RuntimeException('Deployment runner is missing or checksum validation failed.');
              }
              if (!is_executable('/bin/bash')) {
                  throw new RuntimeException('/bin/bash is unavailable.');
              }

              putenv('HOME=' . $home);
              putenv('PATH=/usr/local/bin:/usr/bin:/bin:/usr/local/sbin:/usr/sbin:/sbin');
              putenv('MODRIK_DEMO_ORIGIN_IP=' . $originIp);

              $descriptors = [
                  0 => ['pipe', 'r'],
                  1 => ['pipe', 'w'],
                  2 => ['pipe', 'w'],
              ];
              $process = proc_open(['/bin/bash', $runner, $package, $releaseSha], $descriptors, $pipes, $backendRoot, null, ['bypass_shell' => true]);
              if (!is_resource($process)) {
                  throw new RuntimeException('Unable to start deployment runner.');
              }
              fclose($pipes[0]);
              stream_set_blocking($pipes[1], false);
              stream_set_blocking($pipes[2], false);
              $stdout = '';
              $stderr = '';
              $started = microtime(true);
              $status = ['exitcode' => -1];

              while (true) {
                  $stdout .= (string) stream_get_contents($pipes[1]);
                  $stderr .= (string) stream_get_contents($pipes[2]);
                  $status = proc_get_status($process);
                  if (!$status['running']) {
                      break;
                  }
                  if ((microtime(true) - $started) > 270) {
                      proc_terminate($process, 15);
                      throw new RuntimeException('Deployment runner timed out.');
                  }
                  usleep(100000);
              }

              $stdout .= (string) stream_get_contents($pipes[1]);
              $stderr .= (string) stream_get_contents($pipes[2]);
              fclose($pipes[1]);
              fclose($pipes[2]);
              $exit = proc_close($process);
              if ($exit === -1) {
                  $exit = (int) ($status['exitcode'] ?? -1);
              }
              $output = trim($stdout . ($stderr === '' ? '' : "\n" . $stderr));
              if ($exit !== 0) {
                  throw new RuntimeException('Deployment runner failed (' . $exit . '): ' . substr($output, 0, 12000));
              }

              echo json_encode([
                  'ok' => true,
                  'release_sha' => $releaseSha,
                  'output' => substr($output, 0, 12000),
              ], JSON_UNESCAPED_SLASHES);
          } catch (Throwable $e) {
              http_response_code(500);
              echo json_encode([
                  'ok' => false,
                  'release_sha' => $releaseSha,
                  'error' => substr($e->getMessage(), 0, 12000),
              ], JSON_UNESCAPED_SLASHES);
          }
          PHP

          sed -i \
            -e "s|__TOKEN_FILE__|$token_file|g" \
            -e "s|__RELEASE_SHA__|$RELEASE_SHA|g" \
            -e "s|__PACKAGE_SHA__|$package_sha|g" \
            -e "s|__RUNNER_SHA__|$runner_sha|g" \
            -e "s|__BRIDGE_ORIGIN_IP__|$BRIDGE_ORIGIN_IP|g" \
            -e "s|__REMOTE_PACKAGE__|$remote_package|g" \
            -e "s|__REMOTE_RUNNER__|$remote_runner|g" \
            /tmp/modrik-deploy.php

          {
            echo "REMOTE_BRIDGE=$bridge"
            echo "REMOTE_TOKEN_FILE=$token_file"
            echo "REMOTE_PACKAGE=$remote_package"
            echo "REMOTE_RUNNER=$remote_runner"
          } >> "$GITHUB_ENV"

      - name: Upload package and bridge over WALKA-proven FTPS path
        shell: bash
        run: |
          set -euo pipefail
          lftp -u "$FTP_USER","$FTP_PASSWORD" -p 21 "$FTP_HOST" -e "
            set cmd:fail-exit yes;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate yes;
            set ssl:check-hostname no;
            set ftp:passive-mode true;
            set net:max-retries 2;
            set net:timeout 20;
            put $PACKAGE_ZIP -o $REMOTE_PACKAGE;
            put /tmp/modrik-deploy-runner.sh -o $REMOTE_RUNNER;
            put /tmp/modrik-deploy-token -o $REMOTE_TOKEN_FILE;
            put /tmp/modrik-deploy.php -o $REMOTE_BRIDGE;
            bye;
          "
          echo 'MODRIK_FTPS_UPLOAD_OK'

      - name: Execute protected deployment bridge through web origin
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          token="$(cat /tmp/modrik-deploy-token)"
          body="$RUNNER_TEMP/modrik-deploy-response.json"
          set +e
          http_code="$(curl --silent --show-error \
            --output "$body" \
            --write-out '%{http_code}' \
            --max-time 290 \
            --resolve "$BRIDGE_HOST:443:$BRIDGE_ORIGIN_IP" \
            -H "X-MODRIK-Deploy-Token: $token" \
            "$BRIDGE_URL/$REMOTE_BRIDGE")"
          curl_exit=$?
          set -e
          echo "bridge_curl_exit=$curl_exit"
          echo "bridge_http_status=$http_code"
          if [[ $curl_exit -ne 0 ]]; then
            exit "$curl_exit"
          fi
          if ! jq -e --arg sha "$RELEASE_SHA" '.ok == true and .release_sha == $sha' "$body" >/dev/null 2>&1; then
            if jq -e . "$body" >/dev/null 2>&1; then
              jq '{ok, release_sha, error}' "$body"
            else
              echo 'Bridge returned a non-JSON response.' >&2
            fi
            exit 1
          fi
          jq . "$body"
          echo 'MODRIK_FTPS_DEPLOY_OK'

      - name: Remove one-shot deployment files
        if: always()
        shell: bash
        run: |
          set +e
          [[ -n "${FTP_USER:-}" && -n "${FTP_PASSWORD:-}" ]] || exit 0
          timeout 45 lftp -u "$FTP_USER","$FTP_PASSWORD" -p 21 "$FTP_HOST" -e "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate yes;
            set ssl:check-hostname no;
            set ftp:passive-mode true;
            set net:max-retries 1;
            set net:timeout 10;
            rm -f ${REMOTE_PACKAGE:-.missing};
            rm -f ${REMOTE_RUNNER:-.missing};
            rm -f ${REMOTE_TOKEN_FILE:-.missing};
            rm -f ${REMOTE_BRIDGE:-.missing};
            bye;
          "
          exit 0

      - name: External post-deploy release smoke
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          bash scripts/verify-demo-deployment-smoke.sh "$RELEASE_SHA"
