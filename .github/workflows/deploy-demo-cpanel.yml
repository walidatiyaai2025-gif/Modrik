name: Deploy MODRIK Demo to cPanel

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DEPLOY to confirm the cPanel deployment
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: modrik-demo-cpanel-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.confirm == 'DEPLOY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
      CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME }}
      CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
      CPANEL_REPOSITORY_ROOT: /home/${{ secrets.CPANEL_USERNAME }}/repositories/modrik-demo
      CPANEL_UPLOAD_DIR: /home/${{ secrets.CPANEL_USERNAME }}
      CPANEL_API_BASE: https://${{ secrets.CPANEL_HOST }}:2083/execute

    steps:
      - name: Validate deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CPANEL_HOST" || { echo 'Missing secret: CPANEL_HOST' >&2; exit 1; }
          test -n "$CPANEL_USERNAME" || { echo 'Missing secret: CPANEL_USERNAME' >&2; exit 1; }
          test -n "$CPANEL_API_TOKEN" || { echo 'Missing secret: CPANEL_API_TOKEN' >&2; exit 1; }

      - name: Check out canonical main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Resolve immutable release SHA
        id: release
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4.24
          extensions: curl, fileinfo, intl, mbstring, openssl, pdo_mysql, zip
          coverage: none
          tools: composer:v2

      - name: Install Student Web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Build standalone Student Web
        working-directory: apps/web
        run: npm run build

      - name: Install Backend production dependencies
        working-directory: apps/backend
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress --optimize-autoloader

      - name: Assemble verified cPanel package
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          GITHUB_SHA="$RELEASE_SHA" bash scripts/package-demo-cpanel.sh
          PACKAGE_ZIP="$(find .runtime -maxdepth 1 -type f -name 'modrik-demo-cpanel-*.zip' -print -quit)"
          test -n "$PACKAGE_ZIP"
          unzip -t "$PACKAGE_ZIP" >/dev/null
          echo "PACKAGE_ZIP=$PACKAGE_ZIP" >> "$GITHUB_ENV"
          echo "REMOTE_PACKAGE=modrik-demo-cpanel-$RELEASE_SHA.zip" >> "$GITHUB_ENV"

      - name: Retain deployment package for audit
        uses: actions/upload-artifact@v4
        with:
          name: modrik-demo-cpanel-deploy-${{ steps.release.outputs.sha }}
          path: ${{ env.PACKAGE_ZIP }}
          if-no-files-found: error
          retention-days: 14

      - name: Preflight cPanel UAPI token
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: cpanel $CPANEL_USERNAME:$CPANEL_API_TOKEN" \
            "$CPANEL_API_BASE/Variables/get_server_information")"
          jq -e '.result.status == 1' <<<"$RESPONSE" >/dev/null
          echo 'MODRIK_CPANEL_UAPI_PREFLIGHT_OK'

      - name: Ensure cPanel-managed MODRIK repository
        shell: bash
        run: |
          set -euo pipefail
          AUTH="Authorization: cpanel $CPANEL_USERNAME:$CPANEL_API_TOKEN"
          RETRIEVE="$(curl --fail-with-body --silent --show-error -H "$AUTH" \
            "$CPANEL_API_BASE/VersionControl/retrieve")"
          jq -e '.result.status == 1' <<<"$RETRIEVE" >/dev/null

          if jq -e --arg root "$CPANEL_REPOSITORY_ROOT" '.result.data | any(.repository_root == $root)' <<<"$RETRIEVE" >/dev/null 2>&1; then
            echo "cPanel repository already exists: $CPANEL_REPOSITORY_ROOT"
          else
            SOURCE='{"remote_name":"origin","url":"https://github.com/walidatiyaai2025-gif/Modrik.git"}'
            CREATE="$(curl --fail-with-body --silent --show-error -G -H "$AUTH" \
              --data-urlencode 'type=git' \
              --data-urlencode 'name=MODRIK Demo Deploy' \
              --data-urlencode "repository_root=$CPANEL_REPOSITORY_ROOT" \
              --data-urlencode "source_repository=$SOURCE" \
              "$CPANEL_API_BASE/VersionControl/create")"
            jq -e '.result.status == 1' <<<"$CREATE" >/dev/null
            echo "Created cPanel repository: $CPANEL_REPOSITORY_ROOT"
          fi

      - name: Upload immutable Demo package through cPanel Fileman UAPI
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: cpanel $CPANEL_USERNAME:$CPANEL_API_TOKEN" \
            -F "dir=$CPANEL_UPLOAD_DIR" \
            -F "file-1=@$PACKAGE_ZIP;filename=$REMOTE_PACKAGE" \
            "$CPANEL_API_BASE/Fileman/upload_files")"
          jq -e '.result.status == 1' <<<"$RESPONSE" >/dev/null
          echo "Uploaded $REMOTE_PACKAGE via cPanel UAPI."

      - name: Pull canonical main into cPanel repository
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl --fail-with-body --silent --show-error -G \
            -H "Authorization: cpanel $CPANEL_USERNAME:$CPANEL_API_TOKEN" \
            --data-urlencode "repository_root=$CPANEL_REPOSITORY_ROOT" \
            --data-urlencode 'branch=main' \
            "$CPANEL_API_BASE/VersionControl/update")"
          jq -e '.result.status == 1' <<<"$RESPONSE" >/dev/null
          echo 'cPanel repository updated from GitHub main.'

      - name: Start cPanel deployment task
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl --fail-with-body --silent --show-error -G \
            -H "Authorization: cpanel $CPANEL_USERNAME:$CPANEL_API_TOKEN" \
            --data-urlencode "repository_root=$CPANEL_REPOSITORY_ROOT" \
            "$CPANEL_API_BASE/VersionControlDeployment/create")"
          jq -e '.result.status == 1' <<<"$RESPONSE" >/dev/null
          echo "$RESPONSE" | jq -c '.result.data'

      - name: Wait for exact release marker
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          AUTH="Authorization: cpanel $CPANEL_USERNAME:$CPANEL_API_TOKEN"
          MARKER_DIR="/home/$CPANEL_USERNAME/deploy/modrik-demo"

          for attempt in $(seq 1 36); do
            RESPONSE="$(curl --silent --show-error -G -H "$AUTH" \
              --data-urlencode "dir=$MARKER_DIR" \
              --data-urlencode 'file=current-release.txt' \
              --data-urlencode 'to_charset=UTF-8' \
              "$CPANEL_API_BASE/Fileman/get_file_content" || true)"

            STATUS="$(jq -r '.result.status // 0' <<<"$RESPONSE" 2>/dev/null || echo 0)"
            CONTENT="$(jq -r '.result.data.content // empty' <<<"$RESPONSE" 2>/dev/null | tr -d '\r\n' || true)"
            if [[ "$STATUS" == '1' && "$CONTENT" == "$RELEASE_SHA" ]]; then
              echo "Exact release marker confirmed: $RELEASE_SHA"
              exit 0
            fi

            echo "Waiting for cPanel deployment ($attempt/36)..."
            sleep 5
          done

          echo "Timed out waiting for exact release marker $RELEASE_SHA" >&2
          curl --silent --show-error -H "$AUTH" "$CPANEL_API_BASE/VersionControlDeployment/retrieve" | jq . || true
          exit 1

      - name: External post-deploy smoke
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 2 --max-time 20 https://api.demo.modrik.org/health >/dev/null
          curl --fail --silent --show-error --retry 5 --retry-delay 2 --max-time 20 https://demo.modrik.org/ >/dev/null
          echo 'MODRIK demo deployment is healthy.'
