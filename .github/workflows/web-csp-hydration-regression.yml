name: Web CSP Hydration Regression

on:
  pull_request:
    paths:
      - "apps/web/src/app/layout.tsx"
      - "apps/web/src/proxy.ts"
      - "apps/web/src/security-headers.ts"
      - "apps/web/src/security-headers.test.tsx"
      - "qa/web-csp-hydration/**"
      - ".github/workflows/web-csp-hydration-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  csp-hydration:
    name: Exact-head production CSP hydration
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve exact candidate SHA
        id: candidate
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Web candidate
        working-directory: apps/web
        run: npm ci

      - name: Cache Chromium runtime
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ms-playwright
          key: playwright-1.62.1-chromium-${{ runner.os }}

      - name: Install pinned Playwright runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/playwright" --ignore-scripts --no-save playwright@1.62.1
          PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/ms-playwright" \
            node "$RUNNER_TEMP/playwright/node_modules/playwright/cli.js" install --with-deps chromium

      - name: Build exact production candidate
        env:
          OBSERVED_SHA: ${{ steps.candidate.outputs.sha }}
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .next
          export MODRIK_RUNTIME_INSPECTOR_ENABLED=false
          export MODRIK_RUNTIME_ENVIRONMENT=production
          export MODRIK_BUILD_VERSION=csp-hydration-regression
          export MODRIK_GIT_SHA="$OBSERVED_SHA"
          npm run build

      - name: Execute sanitized Chromium hydration regression
        env:
          NODE_PATH: ${{ runner.temp }}/playwright/node_modules
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
          MODRIK_E2E_TARGET_DIR: ${{ github.workspace }}
          MODRIK_E2E_EVIDENCE_DIR: ${{ github.workspace }}/evidence/csp-hydration
          MODRIK_E2E_OBSERVED_SHA: ${{ steps.candidate.outputs.sha }}
        shell: bash
        run: node qa/web-csp-hydration/csp-hydration-regression.cjs

      - name: Upload sanitized CSP hydration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-csp-hydration-${{ steps.candidate.outputs.sha }}
          path: evidence/csp-hydration
          if-no-files-found: error
          retention-days: 14
