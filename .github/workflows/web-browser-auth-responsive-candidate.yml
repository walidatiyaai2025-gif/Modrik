name: Web Browser Auth Responsive Candidate

on:
  pull_request:
    paths:
      - "qa/web-e2e/auth-responsive-acceptance.cjs"
      - ".github/workflows/web-browser-auth-responsive-candidate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-browser-auth-responsive-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  auth-responsive-pr-128:
    name: PR #128 exact Auth responsive browser acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out Issue #108 harness
        uses: actions/checkout@v4
        with:
          path: harness

      - name: Check out exact PR #128 candidate
        uses: actions/checkout@v4
        with:
          ref: refs/pull/128/head
          fetch-depth: 0
          path: target

      - name: Resolve exact candidate SHA
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git -C target rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: target/apps/web/package-lock.json

      - name: Install Web candidate
        working-directory: target/apps/web
        run: npm ci

      - name: Cache Chromium runtime
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ms-playwright
          key: playwright-1.62.1-chromium-${{ runner.os }}

      - name: Install pinned Playwright runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/playwright" --ignore-scripts --no-save playwright@1.62.1
          PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/ms-playwright" \
            node "$RUNNER_TEMP/playwright/node_modules/playwright/cli.js" install --with-deps chromium

      - name: Build exact Auth candidate
        env:
          OBSERVED_SHA: ${{ steps.candidate.outputs.sha }}
        working-directory: target/apps/web
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .next
          export MODRIK_RUNTIME_INSPECTOR_ENABLED=true
          export MODRIK_RUNTIME_ENVIRONMENT=pilot
          export MODRIK_BUILD_VERSION=auth-responsive-e2e
          export MODRIK_GIT_SHA="$OBSERVED_SHA"
          npm run build

      - name: Execute exact Auth responsive browser acceptance
        env:
          NODE_PATH: ${{ runner.temp }}/playwright/node_modules
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
          MODRIK_E2E_TARGET_DIR: ${{ github.workspace }}/target
          MODRIK_E2E_EVIDENCE_DIR: ${{ github.workspace }}/evidence/auth-responsive-pr-128
          MODRIK_E2E_CANDIDATE: pr-128-auth-responsive
          MODRIK_E2E_OBSERVED_SHA: ${{ steps.candidate.outputs.sha }}
          MODRIK_E2E_SOURCE_SHAS: pr-128=${{ steps.candidate.outputs.sha }}
        shell: bash
        run: node harness/qa/web-e2e/auth-responsive-acceptance.cjs

      - name: Upload sanitized Auth browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-browser-auth-responsive-pr-128-${{ steps.candidate.outputs.sha }}
          path: evidence/auth-responsive-pr-128
          if-no-files-found: error
          retention-days: 14
