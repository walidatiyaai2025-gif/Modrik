name: Arabic7 Practice APK

on:
  push:
    branches:
      - feat/arabic7-offline-practice-app

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct source project
        shell: bash
        run: |
          set -euo pipefail
          cat .arabic7-build/part00.b64 .arabic7-build/part01.b64 .arabic7-build/part02.b64 .arabic7-build/part03.b64 .arabic7-build/part04a1.b64 .arabic7-build/part04a2.b64 .arabic7-build/part04b.b64 .arabic7-build/part05.b64 .arabic7-build/part06.b64 | tr -d '\r\n' | base64 --decode > arabic7-practice-app-src.zip
          unzip -t arabic7-practice-app-src.zip
          unzip -q arabic7-practice-app-src.zip
          test -f arabic7-practice-app/app/src/main/assets/questions.json.gz

      - name: Make asset loading robust
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("arabic7-practice-app/app/src/main/java/com/fiftysolutions/arabic7/MainActivity.java")
          s = p.read_text(encoding="utf-8")
          old = 'BufferedReader br = new BufferedReader(new InputStreamReader(new GZIPInputStream(getAssets().open("questions.json.gz")), "UTF-8"));'
          new = '''BufferedReader br;
                  try {
                      br = new BufferedReader(new InputStreamReader(getAssets().open("questions.json"), "UTF-8"));
                  } catch (Exception plainMissing) {
                      br = new BufferedReader(new InputStreamReader(new GZIPInputStream(getAssets().open("questions.json.gz")), "UTF-8"));
                  }'''
          if old not in s:
              raise SystemExit("Expected loader line not found")
          p.write_text(s.replace(old, new), encoding="utf-8")
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Use hosted Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          fi
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Create Android debug keystore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v               -keystore "$HOME/.android/debug.keystore"               -storepass android               -alias androiddebugkey               -keypass android               -dname "CN=Android Debug,O=Android,C=US"               -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Build installable APK
        working-directory: arabic7-practice-app
        shell: bash
        run: |
          gradle --no-daemon --stacktrace assembleDebug
          test -f app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk ../Arabic7-Practice-1.0.0.apk

      - name: Verify packaged content
        shell: bash
        run: |
          set -euo pipefail
          unzip -t Arabic7-Practice-1.0.0.apk >/dev/null
          unzip -l Arabic7-Practice-1.0.0.apk | grep -E 'assets/questions\.json(\.gz)?'
          test "$(unzip -p Arabic7-Practice-1.0.0.apk assets/questions.json 2>/dev/null | python3 -c 'import json,sys; d=json.load(sys.stdin); print(len(d["questions"]))' || true)" = "650"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Arabic7-Practice-APK
          path: Arabic7-Practice-1.0.0.apk
          if-no-files-found: error
          retention-days: 30
