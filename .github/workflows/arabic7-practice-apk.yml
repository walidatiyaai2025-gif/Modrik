name: Arabic7 Practice APK

on:
  push:
    branches:
      - feat/arabic7-offline-practice-app

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct source project
        shell: bash
        run: |
          set -euo pipefail
          cat .arabic7-build/part00.b64 .arabic7-build/part01.b64 .arabic7-build/part02.b64 .arabic7-build/part03.b64 .arabic7-build/part04a1.b64 .arabic7-build/part04a2.b64 .arabic7-build/part04b.b64 .arabic7-build/part05.b64 .arabic7-build/part06.b64 | tr -d '\r\n' | base64 --decode > arabic7-practice-app-src.zip
          unzip -t arabic7-practice-app-src.zip
          unzip -q arabic7-practice-app-src.zip
          test -f arabic7-practice-app/app/src/main/assets/questions.json.gz

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build installable APK
        working-directory: arabic7-practice-app
        shell: bash
        run: |
          gradle --no-daemon --stacktrace assembleDebug
          test -f app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk ../Arabic7-Practice-1.0.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Arabic7-Practice-APK
          path: Arabic7-Practice-1.0.0.apk
          if-no-files-found: error
          retention-days: 30
