name: Demo cPanel Package

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'apps/backend/**'
      - 'packages/design-tokens/**'
      - 'tests/fixtures/content-pack/v1/valid/content-pack.json'
      - 'deploy/demo/**'
      - 'scripts/package-demo-cpanel.sh'
      - '.github/workflows/demo-cpanel-package.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-cpanel-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4.24
          extensions: curl, fileinfo, intl, mbstring, openssl, pdo_mysql, zip
          coverage: none
          tools: composer:v2

      - name: Install Student Web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Build standalone Student Web
        working-directory: apps/web
        run: npm run build

      - name: Install Backend production dependencies
        working-directory: apps/backend
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress --optimize-autoloader

      - name: Install Backend Admin asset dependencies
        working-directory: apps/backend
        run: npm install --no-audit --no-fund

      - name: Build Backend Admin assets
        working-directory: apps/backend
        run: npm run build

      - name: Verify Admin theme entered Vite manifest
        working-directory: apps/backend
        run: grep -q 'resources/css/filament/admin/theme.css' public/build/manifest.json

      - name: Assemble cPanel Demo ZIP
        run: bash scripts/package-demo-cpanel.sh

      - name: Verify package boundaries
        shell: bash
        run: |
          set -euo pipefail
          test -f .runtime/demo-cpanel/web/startup.cjs
          node --check .runtime/demo-cpanel/web/startup.cjs
          test -s .runtime/demo-cpanel/web/RELEASE_SHA.txt
          test -s .runtime/demo-cpanel/RELEASE_SHA.txt
          cmp -s .runtime/demo-cpanel/RELEASE_SHA.txt .runtime/demo-cpanel/web/RELEASE_SHA.txt
          test -f .runtime/demo-cpanel/web/WEB_APPLICATION_ROOT.txt
          test -f .runtime/demo-cpanel/backend/public/index.php
          test -f .runtime/demo-cpanel/backend/vendor/autoload.php
          test -f .runtime/demo-cpanel/backend/public/build/manifest.json
          grep -q 'resources/css/filament/admin/theme.css' .runtime/demo-cpanel/backend/public/build/manifest.json
          test -f .runtime/demo-cpanel/backend/resources/brand/tokens.json
          test -f .runtime/demo-cpanel/backend/resources/fixtures/content-pack/v1/valid/content-pack.json
          test -f .runtime/demo-cpanel/PORTALS.md
          cmp -s packages/design-tokens/tokens.json .runtime/demo-cpanel/backend/resources/brand/tokens.json
          cmp -s tests/fixtures/content-pack/v1/valid/content-pack.json .runtime/demo-cpanel/backend/resources/fixtures/content-pack/v1/valid/content-pack.json
          php -l .runtime/demo-cpanel/backend/public/index.php
          php -l .runtime/demo-cpanel/backend/database/seeders/LearningSliceSeeder.php
          php -l .runtime/demo-cpanel/backend/database/seeders/DemoAdminSeeder.php
          php -r "chdir('.runtime/demo-cpanel/backend'); require 'vendor/autoload.php'; \$config = require 'config/brand.php'; if ((\$config['name'] ?? null) !== 'MODRIK | مُدرك') { exit(1); }"
          test ! -f .runtime/demo-cpanel/backend/.env
          test ! -f .runtime/demo-cpanel/web/.env
          ZIP_FILE="$(find .runtime -maxdepth 1 -type f -name 'modrik-demo-cpanel-*.zip' -print -quit)"
          test -n "$ZIP_FILE"
          unzip -l "$ZIP_FILE" | grep -q 'demo-cpanel/DEPLOY.md'
          unzip -l "$ZIP_FILE" | grep -q 'demo-cpanel/PORTALS.md'
          unzip -l "$ZIP_FILE" | grep -q 'demo-cpanel/web/startup.cjs'
          unzip -l "$ZIP_FILE" | grep -q 'demo-cpanel/web/RELEASE_SHA.txt'
          unzip -l "$ZIP_FILE" | grep -q 'demo-cpanel/web/WEB_APPLICATION_ROOT.txt'
          unzip -l "$ZIP_FILE" | grep -q 'demo-cpanel/backend/public/index.php'
          unzip -l "$ZIP_FILE" | grep -q 'demo-cpanel/backend/public/build/manifest.json'
          unzip -l "$ZIP_FILE" | grep -q 'demo-cpanel/backend/resources/brand/tokens.json'
          unzip -l "$ZIP_FILE" | grep -q 'demo-cpanel/backend/resources/fixtures/content-pack/v1/valid/content-pack.json'
          if unzip -Z1 "$ZIP_FILE" | grep -E '(^|/)\.env$'; then
            echo 'Live .env found in Demo package' >&2
            exit 1
          fi

      - name: Boot packaged Student Web and verify static assets
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/modrik-packaged-web.log"
          packaged_release="$(tr -d '\r\n' < .runtime/demo-cpanel/web/RELEASE_SHA.txt)"
          short_release="${packaged_release:0:12}"
          test -n "$packaged_release"
          PORT=3217 \
          HOSTNAME=127.0.0.1 \
          NODE_ENV=production \
          MODRIK_API_BASE_URL=https://api.demo.modrik.org \
          MODRIK_ADMIN_PORTAL_URL=https://api.demo.modrik.org/admin/login \
          node .runtime/demo-cpanel/web/startup.cjs >"$log" 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" >/dev/null 2>&1 || true
            wait "$server_pid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          ready=0
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error --max-time 5 http://127.0.0.1:3217/ >"$RUNNER_TEMP/modrik-packaged-landing.html"; then
              ready=1
              break
            fi
            sleep 1
          done
          if [[ "$ready" != 1 ]]; then
            cat "$log" >&2
            echo 'Packaged Student Web did not become reachable.' >&2
            exit 1
          fi

          landing="$(cat "$RUNNER_TEMP/modrik-packaged-landing.html")"
          [[ "$landing" == *'data-testid="modrik-landing-page"'* ]]
          [[ "$landing" == *'data-testid="modrik-student-portal-entry"'* ]]
          [[ "$landing" == *'data-testid="modrik-web-release-badge"'* ]]
          [[ "$landing" == *"MODRIK deployed release: $packaged_release"* ]]
          [[ "$landing" == *"Build $short_release"* ]]
          [[ "$landing" != *'This screen could not be completed.'* ]]

          css_href="$(printf '%s' "$landing" | grep -oE 'href="/_next/static/[^"]+\.css"' | head -1 | cut -d'"' -f2)"
          test -n "$css_href"
          curl --fail --silent --show-error --max-time 5 "http://127.0.0.1:3217$css_href" >/dev/null

          student="$(curl --fail --silent --show-error --max-time 5 http://127.0.0.1:3217/student)"
          [[ "$student" == *'data-testid="modrik-student-portal"'* ]]
          [[ "$student" == *'class="auth-shell"'* ]]
          [[ "$student" == *'data-testid="modrik-web-release-badge"'* ]]
          [[ "$student" == *"Build $short_release"* ]]
          [[ "$student" != *'This screen could not be completed.'* ]]
          echo "MODRIK_PACKAGED_WEB_RUNTIME_OK release=$short_release portals=landing,student static_css=ok"

      - name: Upload cPanel Demo ZIP
        uses: actions/upload-artifact@v4
        with:
          name: modrik-demo-cpanel-${{ github.sha }}
          path: .runtime/modrik-demo-cpanel-*.zip
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true
