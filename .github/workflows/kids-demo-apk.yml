name: Kids Demo APK

on:
  push:
    branches:
      - main
    paths:
      - 'apps/mobile/**'
      - 'packages/design-tokens/**'
      - '.github/workflows/kids-demo-apk.yml'
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'packages/design-tokens/**'
      - '.github/workflows/kids-demo-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-demo-apk:
    name: Build installable Kids Demo APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true

      - name: Resolve Flutter dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Analyze mobile app
        working-directory: apps/mobile
        run: flutter analyze

      - name: Run mobile tests
        working-directory: apps/mobile
        run: flutter test

      - name: Build Demo-connected Android APK
        working-directory: apps/mobile
        run: |
          flutter build apk --debug --no-pub \
            --dart-define=MODRIK_API_BASE_URL=https://demo.modrik.org

      - name: Stage named APK
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::12}"
          mkdir -p .runtime/kids-apk
          cp apps/mobile/build/app/outputs/flutter-apk/app-debug.apk \
            ".runtime/kids-apk/MODRIK-Kids-Demo-${short_sha}.apk"
          sha256sum ".runtime/kids-apk/MODRIK-Kids-Demo-${short_sha}.apk" \
            > ".runtime/kids-apk/MODRIK-Kids-Demo-${short_sha}.apk.sha256"

      - name: Upload Kids Demo APK
        uses: actions/upload-artifact@v4
        with:
          name: modrik-kids-demo-apk-${{ github.sha }}
          path: .runtime/kids-apk/*
          if-no-files-found: error
          retention-days: 14
