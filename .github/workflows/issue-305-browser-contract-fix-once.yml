name: Issue 305 Browser Contract Fix Once

on:
  push:
    branches:
      - issue-305-year-scoped-self-selection
    paths:
      - .github/workflows/issue-305-browser-contract-fix-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-305-year-scoped-self-selection
          fetch-depth: 0
      - name: Patch browser fixture and selectors
        shell: python
        run: |
          from pathlib import Path
          p = Path('qa/web-e2e/browser-runtime-acceptance.cjs')
          text = p.read_text()

          old_a = '''    {
      id: ids.trackA,
      labels: {'''
          new_a = '''    {
      id: ids.trackA,
      year: { key: "fixture-year", label: "Fixture year 6" },
      labels: {'''
          old_b = '''    {
      id: ids.trackB,
      labels: {'''
          new_b = '''    {
      id: ids.trackB,
      year: { key: "fixture-year", label: "Fixture year 6" },
      labels: {'''
          assert old_a in text and old_b in text
          text = text.replace(old_a, new_a, 1).replace(old_b, new_b, 1)

          old_block = '''    const selector = page.locator(".academic-track-selector select");
    await selector.waitFor({ state: "visible", timeout: 10000 });
    await reachable(selector, page, "E2E_ACADEMIC_TRACK_SELECT");
    const optionText = await selector.locator("option").first().textContent();
    check(Boolean(optionText && optionText.length >= 60), "E2E_ACADEMIC_LONG_LABEL_FIXTURE");'''
          new_block = '''    const yearSelector = page.locator(".academic-track-selector select").nth(0);
    const selector = page.locator(".academic-track-selector select").nth(1);
    await yearSelector.waitFor({ state: "visible", timeout: 10000 });
    await selector.waitFor({ state: "visible", timeout: 10000 });
    await reachable(yearSelector, page, "E2E_ACADEMIC_YEAR_SELECT");
    await reachable(selector, page, "E2E_ACADEMIC_TRACK_SELECT");
    check(await yearSelector.inputValue() === "fixture-year", "E2E_ACADEMIC_YEAR_SELECTION");
    const optionText = await selector.locator("option").first().textContent();
    check(Boolean(optionText && optionText.length >= 60), "E2E_ACADEMIC_LONG_LABEL_FIXTURE");'''
          assert old_block in text
          text = text.replace(old_block, new_block, 1)

          old_wait = '''    await page.locator(".academic-track-selector select").waitFor({ state: "visible", timeout: 10000 });'''
          new_wait = '''    await page.locator(".academic-track-selector select").nth(1).waitFor({ state: "visible", timeout: 10000 });'''
          assert old_wait in text
          text = text.replace(old_wait, new_wait, 1)

          p.write_text(text)
      - name: Remove one-shot helper and commit
        run: |
          rm .github/workflows/issue-305-browser-contract-fix-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/web-e2e/browser-runtime-acceptance.cjs .github/workflows/issue-305-browser-contract-fix-once.yml
          git commit -m "test: align browser acceptance with year-scoped tracks"
          git push origin HEAD:issue-305-year-scoped-self-selection
