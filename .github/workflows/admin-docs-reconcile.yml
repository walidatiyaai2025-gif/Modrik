          replace_once(
              'docs/data/data-dictionary.md',
              'Status: BOOT-008 learning, P0-CONTENT-001 preparation-staging, P0-SYNC-001 offline-answer synchronization, P0-ASSESS-001 authoritative assessment, and P0-AUTH-001 production account lifecycle are physically represented for the synthetic/test boundary; unknown production curriculum, rights, provider credentials, legal facts, and retention values intentionally remain unset.\n',
              'Status: BOOT-008 learning, P0-CONTENT-001 preparation-staging, P0-ADMIN-001 reviewed publication, P0-SYNC-001 offline-answer synchronization, P0-ASSESS-001 authoritative assessment, and P0-AUTH-001 production account lifecycle are physically represented for the synthetic/test boundary; unknown production curriculum, rights, provider credentials, legal facts, and retention values intentionally remain unset.\n'
          )
          replace_once(
              'docs/data/data-dictionary.md',
              "| `preparation_requests` | Immutable, actor-owned bundle-generation settings and deterministic prompt. | ULID primary key; creator FK; SHA-256 of canonical normalized settings; explicit schema version; status indexed by creator. |\n| `preparation_imports` | Durable validation/staging result for a returned archive. | Uploader and archive SHA-256 are unique together; actual and untrusted claimed request IDs remain distinct; pack/rights metadata and structured validation summary are retained; `staged` never means published. |\n| `preparation_import_files` | Per-file validation checkpoint inside a staged import. | Unique `(preparation_import_id, path)`; allowed media type, byte count, and declared/computed SHA-256 are retained; only validated files receive rows. |\n",
              "| `preparation_requests` | Immutable, actor-owned bundle-generation settings and deterministic prompt. | ULID primary key; creator FK; SHA-256 of canonical normalized settings; explicit schema version; status indexed by creator. Regeneration creates a replacement request and marks the old request `superseded` with `superseded_by_request_id`/time rather than mutating its settings. |\n| `preparation_imports` | Durable returned-archive validation, review and publication lifecycle state. | Uploader/archive binding remains immutable; validated content plus canonical SHA-256 snapshot, dry-run summary/hash, review decision/actor/time, publication actor/time, operation state/checkpoint/attempts and sanitized error fingerprint are retained. Stale settings force `superseded` and cannot continue to review/import/publication. |\n| `preparation_import_files` | Per-file validation checkpoint inside a staged import. | Unique `(preparation_import_id, path)`; allowed media type, byte count, and declared/computed SHA-256 are retained; only validated files receive rows. |\n| `content_publications` | One durable canonical-import/publication operation per preparation import. | Unique `preparation_import_id`; stable operation identity survives retry/replay; status/checkpoint/attempt/error fingerprint/published time are operational metadata. A published operation is replayed rather than duplicated. |\n| `content_publication_items` | Exact canonical entities owned/reused by one publication operation. | Unique `(content_publication_id, entity_type, entity_id)`; action records `created` vs `reused`. Only reviewed/imported publication items can transition draft canonical rows to published. |\n| `content_workflow_audits` | Immutable operator workflow history for preparation, review, import, supersession, failures and publication. | ULID event row with optional request/import/actor IDs, from/to status, reason, JSON metadata and timestamp; indexed per import/request and append-only in normal operation. |\n"
          )
          replace_once(
              'docs/data/data-dictionary.md',
              "- Preparation request: `ready`, `returned`, `expired`, `cancelled`.\n- Preparation import: `validating`, `rejected`, `staged`. Publication/import into curriculum tables is a separate, not-yet-implemented reviewed workflow.\n",
              "- Preparation request: current deterministic requests plus terminal `superseded` when changed settings generate a replacement; prior preparation lifecycle values remain compatibility state where present.\n- Preparation import: `validating`, `rejected`, `staged`, `validated`, `reviewed`, `imported`, `published`, `superseded`. `reviewed` still requires an explicit decision and only `approved` can enter canonical import.\n- Content publication operation: `queued`, `importing`, `imported`, `publishing`, `published`, `failed`, `superseded`; failure is retryable operational state, not permission to bypass review/freshness/hash checks.\n"
          )
          replace_once(
              'docs/data/data-dictionary.md',
              '- Preparation imports end at a validated `staged` boundary. They do not insert, update, or publish curriculum rows; real-content review/publication requires a later explicit workflow.\n',
              '- Preparation staging remains non-publishing. Only the separate Admin reviewed-publication workflow may create/reuse canonical draft rows and publish them after fresh settings, deterministic dry-run, approved review and exact snapshot/scope validation. It never creates an academic track or synthesizes board/syllabus/rights values.\n'
          )

