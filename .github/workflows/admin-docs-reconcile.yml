              '| Unauthorized official content | Content Team/Admin route guard, backend-owned preparation bindings, provenance/rights state, fixture-only automatic staging, and no staging-to-publication write path. | Student-role denial, rights-boundary, and zero-curriculum-write workflow tests. |\n',
