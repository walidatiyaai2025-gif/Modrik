name: Admin Documentation Reconcile

on:
  push:
    branches:
      - p0-admin-001-filament-content-workflow

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p0-admin-001-filament-content-workflow
          fetch-depth: 0
      - name: Reconcile Admin and integration documentation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one marker, found {count}: {old[:100]}')
              p.write_text(text.replace(old, new, 1))

          # CURRENT_STATE: correct the now-merged Mobile evidence and make Admin the sole Wave-1 candidate.
          replace_once(
              'CURRENT_STATE.md',
              "- Issue #18 (`P0-MOBILE-001`, REQ-P0-008/012 / AC-P0-014) is reconciled on PR #22 onto Auth-integrated `main` and is implementation-complete pending only the final documentation-tree CI. Mobile consumes production opaque bearer sessions, preserves the exact persisted Assessment question/option order and same-attempt resume, sends no seed/order/scoring authority, and consumes merged Sync `POST /v1/sync/answers` with immutable operation IDs/payloads, durable acknowledgement/replay/conflict semantics, revision recovery, and JSON-shaped answer values including arrays. The reconciliation fixed the earlier String-only client assumption for multiple-choice answers without changing Backend/OpenAPI/domain authority. Android/iOS remain the target; Windows remains deferred.\n- Parallel Wave 1 integration order is Assessment → Auth → Mobile → Admin/Content. Assessment, Sync, Student Web and Auth are integrated. Mobile #22 is the active merge candidate after final root-evidence CI; Admin/Content #27 follows and must be reconciled independently onto latest `main`. Issue #21 remains a separate Backend academic-track-catalogue dependency and is not silently folded into this wave.\n",
              "- Issue #18 (`P0-MOBILE-001`, REQ-P0-008/012 / AC-P0-014) is integrated on `main` through PR #22 by merge commit `64775bafdd4a854755aec0daa9b35648b5f5209d`. Mobile consumes production opaque bearer sessions, preserves the exact persisted Assessment question/option order and same-attempt resume, sends no seed/order/scoring authority, and consumes merged Sync `POST /v1/sync/answers` with immutable operation IDs/payloads, durable acknowledgement/replay/conflict semantics, revision recovery, and JSON-shaped answer values including arrays. Final tested head `76d95c2d3a1c238896154388c404bf1d479f0d18` passed all seven jobs in run `32396793763`, and the merged tree matched the tested tree exactly. Android/iOS remain the target; Windows remains deferred.\n- Issue #19 (`P0-ADMIN-001`, REQ-P0-003/004/009 / AC-P0-001/006..008) is reconciled on PR #27 onto Mobile-integrated `main`. The Admin/Content Team-only Filament workflow now covers settings/prompt/bundle preparation, origin-bound ZIP validation, deterministic dry-run/diff, approve/reject/request-fix review, reviewed canonical draft import, official publication, immutable workflow audit, transactional outbox signals, stale regeneration with `PREPARATION_REGENERATION_REQUIRED`, deterministic supersession, and safe retry checkpoints. It never synthesizes an academic track, board, syllabus/version or rights fact and has no UGC auto-promotion path. Code/test head `ca83cf9a06ae71de527498ca852a83be1a1e0e89` passed all seven jobs in run `32399779101`; this documentation reconciliation changes the tree, so PR #27 still requires one fresh complete seven-job pass before Ready/merge.\n- Parallel Wave 1 integration order is Assessment → Auth → Mobile → Admin/Content. Web, Sync, Assessment, Auth and Mobile are integrated. Admin/Content #27 is the sole remaining implementation merge candidate. Issue #21 remains a separate open Backend academic-track-catalogue dependency and is not silently folded into this wave.\n"
          )
          replace_once(
              'CURRENT_STATE.md',
              "- Issue #18 reconciled code head `b9e420580daa38541839e1a92054d30722893303`, based on Auth-integrated `main`, passed Bootstrap CI run `32396448445` across all seven jobs. Mobile integration tests explicitly cover production opaque bearer forwarding, start-attempt authority with quiz ID only, exact same-attempt/order resume, scalar/array JSON answer preservation, deep payload freezing after transport, canonical `/v1/sync/answers` payloads and ACK replay, terminal revision-conflict reload/requeue, academic-reset cache invalidation, AR/EN/FR direction, accessibility and offline/permission states. Because this root documentation reconciliation changes the tree, PR #22 requires one fresh complete seven-job pass on its final head before merge.\n",
              "- Issue #18 final tested head `76d95c2d3a1c238896154388c404bf1d479f0d18` passed Bootstrap CI run `32396793763` across all seven jobs before PR #22 merged on `main` at `64775bafdd4a854755aec0daa9b35648b5f5209d`; tested-head-to-merge comparison reported zero changed files. Mobile integration tests cover production opaque bearer forwarding, start-attempt authority with quiz ID only, exact same-attempt/order resume, scalar/array JSON answer preservation, deep payload freezing after transport, canonical `/v1/sync/answers` ACK/replay/conflict recovery, academic-reset cache invalidation, AR/EN/FR direction, accessibility and offline/permission states.\n- Issue #19 Admin code/test head `ca83cf9a06ae71de527498ca852a83be1a1e0e89`, based directly on Mobile-integrated `main`, passed Bootstrap CI run `32399779101` across all seven jobs. The Backend gate includes Pint, Larastan level 8 and full SQLite PHPUnit; MariaDB 10.11.18 also passed the complete suite including stale-regeneration precedence, publication replay/conflict, atomic rollback/retry, existing-track enforcement and no board/syllabus synthesis. Because the documentation/evidence reconciliation changes the tree, one fresh complete seven-job run remains mandatory before PR #27 can merge.\n"
          )
          replace_once(
