              "    preparation_import_files {\n      char26 id PK\n      char26 preparation_import_id FK\n      varchar path\n      varchar media_type\n      char64 sha256\n      bigint bytes\n      varchar status\n      int imported_records\n      datetime created_at\n      datetime updated_at\n    }\n",
              "    preparation_import_files {\n      char26 id PK\n      char26 preparation_import_id FK\n      varchar path\n      varchar media_type\n      char64 sha256\n      bigint bytes\n      varchar status\n      int imported_records\n      datetime created_at\n      datetime updated_at\n    }\n    content_publications {\n      char26 id PK\n      char26 preparation_import_id FK_UK\n      char26 initiated_by\n      varchar status\n      varchar checkpoint_nullable\n      int attempt_count\n      varchar last_error_code_nullable\n      char64 last_error_fingerprint_nullable\n      datetime last_error_at_nullable\n      datetime published_at_nullable\n      datetime created_at\n      datetime updated_at\n    }\n    content_publication_items {\n      char26 id PK\n      char26 content_publication_id FK\n      varchar entity_type\n      char26 entity_id\n      varchar action\n      datetime created_at\n      datetime updated_at\n    }\n    content_workflow_audits {\n      char26 id PK\n      char26 preparation_request_id_nullable\n      char26 preparation_import_id_nullable\n      char26 actor_id_nullable\n      varchar action\n      varchar from_status_nullable\n      varchar to_status_nullable\n      text reason_nullable\n      json metadata\n      datetime created_at\n    }\n"
