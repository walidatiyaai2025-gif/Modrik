          admin_entry = """## 2026-08-20 — P0-ADMIN-001 controlled content review and official publication reconciliation

- Reconciled PR #27 / Issue #19 directly onto Mobile-integrated `main` `64775bafdd4a854755aec0daa9b35648b5f5209d` with an Admin-owned implementation diff; integrated Auth, Assessment, Sync, Student Web, Mobile, Academic Context, Ads safety, Outbox, paid-AI-off and `deploy/coming-soon/` contracts remain untouched.
- Added the Filament Preparation Wizard and review queue over the existing deterministic preparation boundary: settings/prompt/bundle display, origin-bound returned ZIP, validation result visibility, deterministic dry-run/diff, approve/reject/request-fix, immutable audit history, AR/EN/FR operator copy and RTL/LTR-capable Admin UX.
- Added a staged → validated → reviewed → imported → published/superseded lifecycle with separate reviewed canonical draft import and official publication. Only `admin` and `content_team` roles can operate this workflow; arbitrary/UGC identifiers have no publication path and official content is never auto-promoted.
- Corrected stale-settings precedence so a superseded request/import surfaces `PREPARATION_REGENERATION_REQUIRED` before unrelated generic workflow-state rejection. Regeneration supersedes non-published imports/publication operations deterministically and retains the replacement request binding/audit/outbox trail.
- Canonical import/publication are transactional and replay-safe, validate the immutable staged content hash, preserve exact publication identity, record sanitized failure fingerprints/checkpoints, and support safe retry after repair. Tests cover changed-snapshot conflicts, rollback on an in-transaction publication failure, exact replay without duplicate publication/outbox rows, and deterministic supersession.
- Publication requires an existing Backend-owned academic track and exact returned scope match. Admin does not create a track or synthesize board, syllabus/version, rights or legal facts; real curriculum remains blocked on owner-controlled inputs and Issue #21 remains open for the separate authorized academic-track catalogue.
- Admin code/test head `ca83cf9a06ae71de527498ca852a83be1a1e0e89` passed Bootstrap CI run `32399779101` across all seven jobs: contracts/OpenAPI/tokens; Composer validate/audit, Pint, Larastan level 8 and full SQLite PHPUnit; MariaDB 10.11.18 fresh migration/seed/full Backend suite; Web audit/lint/typecheck/tests/build; Flutter analyze/tests; Gitleaks; and dependency review. This documentation reconciliation changes the tree, so a fresh complete seven-job run is required before PR #27 can merge.
- No Admin public REST contract was introduced, so Issue #19 does not change the existing OpenAPI surface.

"""
          p.write_text(header + admin_entry + text[len(header):])

          # Operations runbook: add publication triage without inventing production values.
          replace_once(
              'docs/ops/runbook.md',
              '## cPanel worker/scheduler pattern\n',
              """## Admin content-publication triage

Official curriculum publication is an operator-only Laravel/Filament workflow. Only `admin` and `content_team` roles may create/regenerate preparation requests, stage returned archives, review, import reviewed canonical drafts, or publish. A student/UGC identifier is never a publication source.

The expected lifecycle is `staged → validated → reviewed → imported → published`; `superseded` is terminal for non-published work replaced by regenerated settings. If the originating request/settings are stale, the operator-visible recovery code is `PREPARATION_REGENERATION_REQUIRED`. Do not bypass freshness by changing import status, hashes, review decisions, publication rows, or audit/outbox records manually. Regenerate from the current settings, upload the ZIP produced for that exact request, then repeat dry-run/review.

A dry-run must fail closed if the returned content targets an academic track that does not already exist or if board/syllabus/year scope differs from that Backend-owned track. Do not create or edit a production track merely to clear `CONTENT_TARGET_TRACK_MISSING` / `CONTENT_TARGET_TRACK_SCOPE_MISMATCH`; resolve the owner-controlled academic catalogue/input first. Issue #21 remains the separate catalogue dependency for client selection.

Publication/import failures persist only stable error codes and SHA-256 fingerprints plus phase/checkpoint/attempt metadata. Correct the underlying data/configuration issue and retry the same preparation import; exact successful replay is intentionally idempotent. Never delete a publication operation to force a new identity. Real curriculum publication additionally requires owner-confirmed curriculum identifiers and rights evidence; fixture rights do not establish production rights.

## cPanel worker/scheduler pattern
"""
          )

          # QA matrix: publication is separate from preparation/staging.
          replace_once(
              'docs/qa/test-matrix.md',
              "| Content preparation/staging | Student-role denial; deterministic settings hash/prompt/bundle; exact request and multipart replay; changed-payload conflict; compressed/uncompressed/file-count/entry limits; traversal/symlink/compression-ratio rejection; exact manifest files and hashes; request/schema/settings/scope binding; semantic references; synthetic rights boundary; durable rejection audit/checkpoints/outbox; zero curriculum writes. | Content Team review and rights evidence before any real archive is eligible; publication remains a separately approved workflow. |\n",
              "| Content preparation/staging | Student-role denial; deterministic settings hash/prompt/bundle; exact request and multipart replay; changed-payload conflict; compressed/uncompressed/file-count/entry limits; traversal/symlink/compression-ratio rejection; exact manifest files and hashes; request/schema/settings/scope binding; semantic references; synthetic rights boundary; durable rejection audit/checkpoints/outbox; zero curriculum writes. | Content Team review and rights evidence before any real archive is eligible; publication remains a separately approved workflow. |\n| Admin review/publication | Admin/content_team-only operation; originating-request ZIP binding; stale settings emit `PREPARATION_REGENERATION_REQUIRED`; deterministic dry-run and blocking codes; approve/reject/request-fix; reviewed canonical import; exact publication replay without duplicate rows/outbox; changed-snapshot conflict without published-state mutation; in-transaction publication failure rollback and safe retry; imported-work supersession; existing academic-track/scope enforcement; no UGC auto-promotion or board/syllabus synthesis; audit/failure checkpoints on SQLite and MariaDB 10.11. | AR/EN/FR + RTL/LTR operator review; real curriculum/rights/legal inputs confirmed before production publication; inspect retry/audit UX without editing canonical workflow rows. |\n"
          )

