              "Run the complete seven-job matrix on the documentation-reconciled Admin PR #27 head. If current, Admin-scoped, conflict-free and fully green, mark it Ready, merge with an expected-head guard, verify tested-tree equality, record the Admin evidence in Issue #26, then run a separate clean final-main Wave 1 verification. Do not start Wave 2.\n"
