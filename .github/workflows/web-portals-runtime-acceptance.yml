name: Web Portals Runtime Acceptance

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "qa/web-e2e/portal-entry-acceptance.cjs"
      - "scripts/verify-demo-deployment-smoke.sh"
      - "deploy/demo/deploy-demo-cpanel-remote.sh"
      - ".github/workflows/web-portals-runtime-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-portals-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  portals-runtime:
    name: Landing and Student Portal runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Resolve exact candidate SHA
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          if [ -n "$expected" ] && [ "$sha" != "$expected" ]; then
            echo "Exact-head mismatch: checkout=$sha expected=$expected" >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Build exact Web candidate
        working-directory: apps/web
        env:
          NEXT_PUBLIC_MODRIK_RELEASE_SHA: ${{ steps.candidate.outputs.sha }}
          MODRIK_RUNTIME_ENVIRONMENT: pilot
        run: npm run build

      - name: Cache Chromium runtime
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ms-playwright
          key: playwright-1.62.1-chromium-${{ runner.os }}

      - name: Install pinned Playwright runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/playwright" --ignore-scripts --no-save playwright@1.62.1
          PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/ms-playwright" \
            node "$RUNNER_TEMP/playwright/node_modules/playwright/cli.js" install --with-deps chromium

      - name: Start exact production Web candidate
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- --hostname 127.0.0.1 --port 3102 > "$RUNNER_TEMP/modrik-portals-web.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/modrik-portals-web.pid"
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:3102/ >/dev/null \
              && curl --fail --silent --show-error http://127.0.0.1:3102/student >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/modrik-portals-web.log" >&2 || true
          exit 1

      - name: Execute exact-head Landing to Student matrix
        env:
          NODE_PATH: ${{ runner.temp }}/playwright/node_modules
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
          MODRIK_PORTAL_BASE_URL: http://127.0.0.1:3102
          MODRIK_PORTAL_EVIDENCE_DIR: ${{ github.workspace }}/evidence/web-portals-runtime
          MODRIK_PORTAL_EXPECTED_SHA: ${{ steps.candidate.outputs.sha }}
        run: node qa/web-e2e/portal-entry-acceptance.cjs

      - name: Require exact-head PASS evidence
        env:
          EXPECTED_SHA: ${{ steps.candidate.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib
          path = pathlib.Path('evidence/web-portals-runtime/acceptance.json')
          if not path.exists():
              raise SystemExit('missing Web portal acceptance evidence')
          payload = json.loads(path.read_text(encoding='utf-8'))
          if payload.get('status') != 'PASS':
              raise SystemExit(f"portal acceptance is not PASS: {payload.get('status')}")
          if payload.get('expected_sha') != os.environ['EXPECTED_SHA']:
              raise SystemExit('portal acceptance SHA mismatch')
          cases = payload.get('cases', [])
          expected = {'desktop-en', 'mobile-fr-360-200', 'mobile-ar-320-200'}
          actual = {case.get('name') for case in cases if case.get('status') == 'PASS'}
          if actual != expected or len(cases) != 3:
              raise SystemExit(f'unexpected portal matrix: {sorted(actual)}')
          print('Landing -> Student Portal matrix: 3 PASS / 0 FAIL')
          PY

      - name: Stop Web candidate
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/modrik-portals-web.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/modrik-portals-web.pid")" 2>/dev/null || true
          fi

      - name: Upload sanitized portal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-portals-runtime-${{ steps.candidate.outputs.sha }}
          path: evidence/web-portals-runtime
          if-no-files-found: warn
          retention-days: 14
