name: Web Browser Learning Responsive Candidate

on:
  pull_request:
    paths:
      - "qa/web-e2e/**"
      - ".github/workflows/web-browser-learning-responsive-candidate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-browser-learning-responsive-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  learning-responsive-regression:
    name: "Integrated Issue #125 Learning responsive regression"
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: "Check out browser acceptance harness"
        uses: actions/checkout@v4
        with:
          path: harness

      - name: Check out authoritative main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          path: target-exact

      - name: Resolve integrated regression head
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          main_sha="$(git -C target-exact rev-parse HEAD)"
          mkdir -p evidence/learning-responsive-candidate

          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"
          echo "candidate_sha=$main_sha" >> "$GITHUB_OUTPUT"

          MAIN_SHA="$main_sha" HARNESS_SHA="$GITHUB_SHA" python3 - <<'PY'
          import json, os, pathlib
          payload = {
              "schema_version": "modrik.web.learning-responsive-integrated.v1",
              "status": "READY_FOR_BROWSER_EXECUTION",
              "main_sha": os.environ["MAIN_SHA"],
              "candidate_sha": os.environ["MAIN_SHA"],
              "candidate": "integrated-main",
              "source_issue": 125,
              "harness_sha": os.environ["HARNESS_SHA"],
          }
          pathlib.Path("evidence/learning-responsive-candidate/candidate.json").write_text(
              json.dumps(payload, indent=2) + "\n", encoding="utf-8"
          )
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: target-exact/apps/web/package-lock.json

      - name: Install integrated candidate dependencies
        working-directory: target-exact/apps/web
        run: npm ci

      - name: Cache Chromium runtime
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ms-playwright
          key: playwright-1.62.1-chromium-${{ runner.os }}

      - name: Install pinned Playwright runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/playwright" --ignore-scripts --no-save playwright@1.62.1
          PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/ms-playwright" \
            node "$RUNNER_TEMP/playwright/node_modules/playwright/cli.js" install --with-deps chromium

      - name: Build integrated current-main candidate
        working-directory: target-exact/apps/web
        env:
          OBSERVED_SHA: ${{ steps.candidate.outputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .next
          export MODRIK_RUNTIME_INSPECTOR_ENABLED=true
          export MODRIK_RUNTIME_ENVIRONMENT=pilot
          export MODRIK_BUILD_VERSION=learning-responsive-e2e
          export MODRIK_GIT_SHA="$OBSERVED_SHA"
          npm run build

      - name: Run integrated complete core matrix
        id: exact_core
        continue-on-error: true
        env:
          NODE_PATH: ${{ runner.temp }}/playwright/node_modules
          NODE_OPTIONS: --require=${{ github.workspace }}/harness/qa/web-e2e/student-entry-route-adapter.cjs
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
          MODRIK_E2E_TARGET_DIR: ${{ github.workspace }}/target-exact
          MODRIK_E2E_EVIDENCE_DIR: ${{ github.workspace }}/evidence/learning-responsive-candidate/exact
          MODRIK_E2E_CANDIDATE: issue-125-integrated-main-core
          MODRIK_E2E_PROFILE: core
          MODRIK_E2E_EXPECTED_SHA: ${{ steps.candidate.outputs.candidate_sha }}
          MODRIK_E2E_OBSERVED_SHA: ${{ steps.candidate.outputs.candidate_sha }}
          MODRIK_E2E_SOURCE_SHAS: main=${{ steps.candidate.outputs.main_sha }}
        shell: bash
        run: node harness/qa/web-e2e/browser-runtime-acceptance.cjs

      - name: Capture integrated sanitized overflow geometry
        id: geometry
        continue-on-error: true
        env:
          NODE_PATH: ${{ runner.temp }}/playwright/node_modules
          NODE_OPTIONS: --require=${{ github.workspace }}/harness/qa/web-e2e/student-entry-route-adapter.cjs
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
          MODRIK_E2E_TARGET_DIR: ${{ github.workspace }}/target-exact
          MODRIK_E2E_EVIDENCE_DIR: ${{ github.workspace }}/evidence/learning-responsive-candidate/exact
          MODRIK_E2E_EXPECTED_SHA: ${{ steps.candidate.outputs.candidate_sha }}
          MODRIK_E2E_HARNESS_SHA: ${{ github.sha }}
        shell: bash
        run: node harness/qa/web-e2e/browser-overflow-diagnostics.cjs

      - name: Run integrated offline/retry regression
        id: offline
        continue-on-error: true
        env:
          NODE_PATH: ${{ runner.temp }}/playwright/node_modules
          NODE_OPTIONS: --require=${{ github.workspace }}/harness/qa/web-e2e/student-entry-route-adapter.cjs
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
          MODRIK_E2E_TARGET_DIR: ${{ github.workspace }}/target-exact
          MODRIK_E2E_EVIDENCE_DIR: ${{ github.workspace }}/evidence/learning-responsive-candidate/exact
          MODRIK_E2E_CANDIDATE: issue-125-integrated-main-learning-offline
          MODRIK_E2E_OBSERVED_SHA: ${{ steps.candidate.outputs.candidate_sha }}
        shell: bash
        run: node harness/qa/web-e2e/learning-offline-acceptance.cjs

      - name: Run integrated stale-session 401 regression
        id: session_security
        continue-on-error: true
        env:
          NODE_PATH: ${{ runner.temp }}/playwright/node_modules
          NODE_OPTIONS: --require=${{ github.workspace }}/harness/qa/web-e2e/student-entry-route-adapter.cjs
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
          MODRIK_E2E_TARGET_DIR: ${{ github.workspace }}/target-exact
          MODRIK_E2E_EVIDENCE_DIR: ${{ github.workspace }}/evidence/learning-responsive-candidate/exact
          MODRIK_E2E_CANDIDATE: issue-125-integrated-main-session-security
          MODRIK_E2E_PROFILE: session-security
          MODRIK_E2E_EXPECTED_SHA: ${{ steps.candidate.outputs.candidate_sha }}
          MODRIK_E2E_OBSERVED_SHA: ${{ steps.candidate.outputs.candidate_sha }}
        shell: bash
        run: node harness/qa/web-e2e/browser-runtime-acceptance.cjs

      - name: Require integrated Learning responsive acceptance
        env:
          EXACT_EVIDENCE: ${{ github.workspace }}/evidence/learning-responsive-candidate/exact/issue-125-integrated-main-core.json
          EXACT_CORE_OUTCOME: ${{ steps.exact_core.outcome }}
          GEOMETRY_OUTCOME: ${{ steps.geometry.outcome }}
          OFFLINE_OUTCOME: ${{ steps.offline.outcome }}
          SESSION_OUTCOME: ${{ steps.session_security.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib

          exact_path = pathlib.Path(os.environ["EXACT_EVIDENCE"])
          if not exact_path.exists():
              raise SystemExit("missing integrated Issue #125 browser evidence")
          exact = json.loads(exact_path.read_text(encoding="utf-8"))

          learning = [case for case in exact.get("cases", []) if case.get("surface") == "learning"]
          expected_learning = {
              "desktop-en",
              "desktop-ar",
              "tablet-fr",
              "mobile-en-390",
              "mobile-fr-360-200",
              "mobile-ar-320-200",
          }
          learning_names = {case.get("name") for case in learning}
          if learning_names != expected_learning:
              raise SystemExit(f"unexpected Learning matrix: {sorted(learning_names)}")

          failed_learning = [case for case in learning if case.get("status") != "PASS"]
          failed_core = [case for case in exact.get("cases", []) if case.get("status") != "PASS"]
          supporting_failures = [
              name
              for name, outcome in (
                  ("integrated core", os.environ["EXACT_CORE_OUTCOME"]),
                  ("sanitized geometry", os.environ["GEOMETRY_OUTCOME"]),
                  ("offline/retry", os.environ["OFFLINE_OUTCOME"]),
                  ("stale-session 401", os.environ["SESSION_OUTCOME"]),
              )
              if outcome != "success"
          ]

          if failed_core:
              print("Integrated Issue #125 browser rows remain red:")
              for case in failed_core:
                  print(f"- {case.get('surface')}:{case.get('name')}: {case.get('failure_code', 'UNKNOWN')}")
          if supporting_failures:
              print("Supporting integrated regressions failed: " + ", ".join(supporting_failures))

          if failed_learning or failed_core or supporting_failures:
              raise SystemExit(1)

          print("Integrated Issue #125 Learning/Study matrix: 6 PASS / 0 FAIL")
          print(f"Integrated complete core matrix: {len(exact.get('cases', []))} PASS / 0 FAIL")
          print("Offline/retry + stale-session 401 + sanitized geometry: PASS")
          PY

      - name: Upload sanitized Learning regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-browser-learning-responsive-candidate
          path: evidence/learning-responsive-candidate
          if-no-files-found: error
          retention-days: 14
