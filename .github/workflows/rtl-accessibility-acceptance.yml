name: RTL Accessibility Exact Head Acceptance

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "apps/mobile/**"
      - "qa/web-e2e/**"
      - "docs/learning/ARABIC_RTL_UX_SPEC.md"
      - ".github/workflows/rtl-accessibility-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rtl-accessibility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web-learning:
    name: Student Web RTL + large-text exact-head
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - id: candidate
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install Web dependencies
        working-directory: apps/web
        run: npm ci
      - name: Build exact Web candidate
        working-directory: apps/web
        env:
          MODRIK_RUNTIME_INSPECTOR_ENABLED: "true"
          MODRIK_RUNTIME_ENVIRONMENT: pilot
          MODRIK_BUILD_VERSION: rtl-accessibility-e2e
          MODRIK_GIT_SHA: ${{ steps.candidate.outputs.sha }}
        run: npm run build
      - name: Cache Chromium runtime
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ms-playwright
          key: rtl-accessibility-playwright-1.62.1-${{ runner.os }}
      - name: Install pinned Playwright runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/playwright" --ignore-scripts --no-save playwright@1.62.1
          PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/ms-playwright" \
            node "$RUNNER_TEMP/playwright/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Execute Student auth + learning RTL/large-text matrix
        env:
          NODE_PATH: ${{ runner.temp }}/playwright/node_modules
          NODE_OPTIONS: --require=${{ github.workspace }}/qa/web-e2e/student-entry-route-adapter.cjs
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
          MODRIK_E2E_TARGET_DIR: ${{ github.workspace }}
          MODRIK_E2E_EVIDENCE_DIR: ${{ github.workspace }}/evidence/rtl-accessibility
          MODRIK_E2E_CANDIDATE: issue-359-exact-head
          MODRIK_E2E_EXPECTED_SHA: ${{ steps.candidate.outputs.sha }}
          MODRIK_E2E_OBSERVED_SHA: ${{ steps.candidate.outputs.sha }}
        run: node qa/web-e2e/catalogue-browser-runtime-acceptance.cjs
      - name: Require complete #359 Student browser matrix
        env:
          EXPECTED_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          path = pathlib.Path("evidence/rtl-accessibility/issue-359-exact-head.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          if data.get("expected_sha") != os.environ["EXPECTED_SHA"] or data.get("observed_sha") != os.environ["EXPECTED_SHA"]:
              raise SystemExit("exact-head SHA mismatch")
          if any(case.get("status") != "PASS" for case in data.get("cases", [])):
              raise SystemExit("one or more #359 browser cases failed")
          learning = {
              case.get("name").split(":", 1)[1]
              for case in data.get("cases", [])
              if case.get("surface") == "catalogue-learning" and case.get("status") == "PASS"
          }
          required = {
              "desktop-en", "desktop-ar", "tablet-fr", "mobile-en-412",
              "mobile-en-390", "mobile-fr-360-200", "mobile-ar-320-200",
          }
          if learning != required:
              raise SystemExit(f"unexpected Student learning matrix: {sorted(learning)}")
          states = [case for case in data.get("cases", []) if case.get("name") == "states:auth-catalogue-account" and case.get("status") == "PASS"]
          if len(states) != 1:
              raise SystemExit("loading/error/retry state evidence missing")
          print("Student #359 exact-head matrix: PASS")
          PY
      - name: Upload #359 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rtl-accessibility-student-${{ steps.candidate.outputs.sha }}
          path: evidence/rtl-accessibility
          if-no-files-found: error
          retention-days: 30
