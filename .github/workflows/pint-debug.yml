name: Pint Debug

on:
  push:
    branches:
      - hotfix/dashboard-update-live-activation

permissions:
  contents: read

jobs:
  pint-diff:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4.25'
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Print exact Pint diff
        run: |
          cp app/Services/Updates/TransactionalReleaseManager.php /tmp/TransactionalReleaseManager.before.php
          vendor/bin/pint app/Services/Updates/TransactionalReleaseManager.php
          diff -u /tmp/TransactionalReleaseManager.before.php app/Services/Updates/TransactionalReleaseManager.php || true
