name: Issue 305 PR Patch Trigger

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'issue-305-year-scoped-self-selection'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-305-year-scoped-self-selection
          fetch-depth: 0
      - name: Execute staged owner-authorized patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/issue-305-apply-patch-once.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(workflow) if "python3 <<'PY'" in line) + 1
          end = next(i for i in range(start, len(workflow)) if workflow[i].strip() == 'PY')
          source = textwrap.dedent('\n'.join(workflow[start:end]))
          source = source.replace('AcademicTrack:', 'AcademicTrackCatalogueItem:')
          exec(compile(source, 'issue-305-owner-patch.py', 'exec'), {})
          PY
          rm -f .github/workflows/issue-305-apply-patch-once.yml .github/workflows/issue-305-pr-patch-trigger.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "P0 Academic: year-scoped learner self-selection (#305)"
          git push origin HEAD:issue-305-year-scoped-self-selection
