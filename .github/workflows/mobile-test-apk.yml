name: MODRIK Mobile Test APK

on:
  push:
    branches:
      - codex/mobile-test-apk-e396f0ee

permissions:
  contents: read

jobs:
  android-test-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze mobile app
        run: flutter analyze

      - name: Run mobile tests
        run: flutter test

      - name: Build Android debug APK against Demo API
        run: >-
          flutter build apk --debug
          --dart-define=MODRIK_API_BASE_URL=https://api.demo.modrik.org

      - name: Stage installable APK
        run: |
          cp build/app/outputs/flutter-apk/app-debug.apk "$GITHUB_WORKSPACE/MODRIK-Android-Test-e396f0ee.apk"
          sha256sum "$GITHUB_WORKSPACE/MODRIK-Android-Test-e396f0ee.apk" > "$GITHUB_WORKSPACE/MODRIK-Android-Test-e396f0ee.apk.sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MODRIK-Android-Test-e396f0ee
          path: |
            MODRIK-Android-Test-e396f0ee.apk
            MODRIK-Android-Test-e396f0ee.apk.sha256
          if-no-files-found: error
          retention-days: 7
