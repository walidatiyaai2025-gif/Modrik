name: Owner-authorized one-shot Demo Node runtime diagnostic

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/demo-node-runtime-diagnostic-once.yml

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    if: ${{ contains(github.event.head_commit.message, '[OWNER-DEMO-DIAG]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FTP_HOST: ftp.50sols.com
      FTP_USER: ${{ secrets.CPANEL_FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.CPANEL_FTP_PASSWORD }}
      BRIDGE_URL: https://50sols.com
      BRIDGE_HOST: 50sols.com
      BRIDGE_ORIGIN_IP: 65.21.208.232
      DEMO_HOST: demo.modrik.org

    steps:
      - name: Validate diagnostic secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FTP_USER" || { echo 'Missing secret: CPANEL_FTP_USERNAME' >&2; exit 1; }
          test -n "$FTP_PASSWORD" || { echo 'Missing secret: CPANEL_FTP_PASSWORD' >&2; exit 1; }

      - name: Record diagnostic run in Issue 260
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh issue comment 260 --repo "$GITHUB_REPOSITORY" --body "DEMO LITESPEED HOST-RUNTIME DIAGNOSTIC STARTED\n\n- run: \`$GITHUB_RUN_ID\`\n- source main: \`$GITHUB_SHA\`\n- URL: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\n\nRead-only server-runtime diagnostic. It inspects process/resource limits, LiteSpeed/lsnode availability, CageFS visibility and the existing CloudLinux Node application. No deployment, kill, restart, package install, selector mutation or hosting mutation is authorized by this run."

      - name: Install FTPS client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends lftp >/dev/null

      - name: Prepare protected read-only diagnostic bridge
        shell: bash
        run: |
          set -euo pipefail
          token="$(openssl rand -hex 32)"
          nonce="$(openssl rand -hex 12)"
          bridge="modrik-node-diag-$nonce.php"
          token_file=".modrik-node-diag-token-$nonce"

          echo "::add-mask::$token"
          printf '%s' "$token" > /tmp/modrik-node-diag-token

          cat > /tmp/modrik-node-diag.php <<'PHP'
          <?php
          declare(strict_types=1);

          set_time_limit(45);
          header('Content-Type: application/json; charset=utf-8');
          header('Cache-Control: no-store');

          $expectedToken = trim((string) @file_get_contents(__DIR__ . '/__TOKEN_FILE__'));
          $providedToken = (string) ($_SERVER['HTTP_X_MODRIK_DIAG_TOKEN'] ?? '');
          if ($expectedToken === '' || !hash_equals($expectedToken, $providedToken)) {
              http_response_code(404);
              echo json_encode(['ok' => false]);
              exit;
          }

          $home = '/home/solscool';
          $webRoot = $home . '/public_html/demo.modrik.org';
          $appRootRel = 'public_html/demo.modrik.org';
          $safeAppKeys = [
              'app_root', 'app_uri', 'domain', 'version', 'startup_file', 'startup-file',
              'app_mode', 'mode', 'status', 'app_status', 'enabled', 'passenger_log_file',
          ];

          $run = static function (array $command, ?string $cwd = null): array {
              $descriptors = [0 => ['pipe', 'r'], 1 => ['pipe', 'w'], 2 => ['pipe', 'w']];
              $process = @proc_open($command, $descriptors, $pipes, $cwd, null, ['bypass_shell' => true]);
              if (!is_resource($process)) {
                  return ['exit' => -1, 'stdout' => '', 'stderr' => 'proc_open_failed'];
              }
              fclose($pipes[0]);
              $stdout = (string) stream_get_contents($pipes[1]);
              $stderr = (string) stream_get_contents($pipes[2]);
              fclose($pipes[1]);
              fclose($pipes[2]);
              $exit = proc_close($process);
              return [
                  'exit' => $exit,
                  'stdout' => substr(trim($stdout), 0, 12000),
                  'stderr' => substr(trim($stderr), 0, 4000),
              ];
          };

          $extractApps = static function (mixed $value) use (&$extractApps, $safeAppKeys, $appRootRel): array {
              $matches = [];
              if (!is_array($value)) {
                  return $matches;
              }

              $root = $value['app_root'] ?? $value['app-root'] ?? null;
              if (is_string($root) && trim($root, '/') === $appRootRel) {
                  $safe = [];
                  foreach ($safeAppKeys as $key) {
                      if (array_key_exists($key, $value) && (is_scalar($value[$key]) || $value[$key] === null)) {
                          $safe[$key] = $value[$key];
                      }
                  }
                  $matches[] = $safe;
              }

              foreach ($value as $child) {
                  if (is_array($child)) {
                      array_push($matches, ...$extractApps($child));
                  }
              }
              return $matches;
          };

          $mode = static function (string $path): ?string {
              $perms = @fileperms($path);
              return is_int($perms) ? substr(sprintf('%o', $perms), -4) : null;
          };

          $fileState = static function (string $path) use ($mode): array {
              return [
                  'exists' => file_exists($path),
                  'is_file' => is_file($path),
                  'is_dir' => is_dir($path),
                  'readable' => is_readable($path),
                  'executable' => is_executable($path),
                  'mode' => file_exists($path) ? $mode($path) : null,
                  'uid' => file_exists($path) ? @fileowner($path) : null,
                  'gid' => file_exists($path) ? @filegroup($path) : null,
              ];
          };

          $limitNames = [
              'Max processes',
              'Max open files',
              'Max address space',
              'Max resident set',
              'Max data size',
              'Max locked memory',
          ];

          try {
              $identity = $run(['/usr/bin/id', '-un']);
              $user = $identity['exit'] === 0 && $identity['stdout'] !== '' ? $identity['stdout'] : 'unknown';
              $uid = function_exists('posix_geteuid') ? posix_geteuid() : @fileowner(__FILE__);
              $gid = function_exists('posix_getegid') ? posix_getegid() : @filegroup(__FILE__);

              $htaccess = [];
              $htaccessPath = $webRoot . '/.htaccess';
              if (is_file($htaccessPath)) {
                  foreach ((array) @file($htaccessPath, FILE_IGNORE_NEW_LINES) as $line) {
                      if (preg_match('/^\s*Passenger(?:AppRoot|BaseURI|Nodejs|AppType|StartupFile|AppEnv)\b/i', (string) $line)) {
                          $htaccess[] = trim((string) $line);
                      }
                  }
              }

              $releaseFile = $webRoot . '/RELEASE_SHA.txt';
              $releaseSha = is_file($releaseFile) ? trim((string) @file_get_contents($releaseFile)) : null;
              if (!is_string($releaseSha) || !preg_match('/^[0-9a-f]{40}$/i', $releaseSha)) {
                  $releaseSha = null;
              }

              $selectorBin = is_executable('/usr/sbin/cloudlinux-selector')
                  ? '/usr/sbin/cloudlinux-selector'
                  : (is_executable('/usr/bin/cloudlinux-selector') ? '/usr/bin/cloudlinux-selector' : null);
              $cagefsBin = is_executable('/bin/cagefs_enter.proxied') ? '/bin/cagefs_enter.proxied' : null;

              $selector = [
                  'available' => $selectorBin !== null,
                  'cagefs_available' => $cagefsBin !== null,
                  'exit' => null,
                  'result' => null,
                  'apps' => [],
              ];

              if ($selectorBin !== null) {
                  $command = $cagefsBin !== null
                      ? [$cagefsBin, $selectorBin, 'get', '--json', '--interpreter', 'nodejs']
                      : [$selectorBin, 'get', '--json', '--interpreter', 'nodejs', '--user', $user];
                  $selectorResult = $run($command, $home);
                  $selector['exit'] = $selectorResult['exit'];
                  $decoded = json_decode($selectorResult['stdout'], true);
                  if (is_array($decoded)) {
                      $selector['result'] = isset($decoded['result']) && is_scalar($decoded['result']) ? (string) $decoded['result'] : null;
                      $selector['apps'] = $extractApps($decoded);
                  } else {
                      $selector['result'] = 'non_json_output';
                  }
              }

              $limits = [];
              $limitsText = (string) @file_get_contents('/proc/self/limits');
              foreach (preg_split('/\R/', $limitsText) ?: [] as $line) {
                  foreach ($limitNames as $limitName) {
                      if (str_starts_with($line, $limitName)) {
                          $limits[$limitName] = preg_replace('/\s+/', ' ', trim($line));
                          break;
                      }
                  }
              }

              $cgroup = [
                  'self' => trim((string) @file_get_contents('/proc/self/cgroup')),
                  'pids_current' => null,
                  'pids_max' => null,
              ];
              if (preg_match('/^0::(.+)$/m', $cgroup['self'], $m)) {
                  $cgRel = trim($m[1]);
                  $cgBase = '/sys/fs/cgroup' . ($cgRel === '/' ? '' : $cgRel);
                  foreach (['pids.current' => 'pids_current', 'pids.max' => 'pids_max'] as $file => $key) {
                      $value = @file_get_contents($cgBase . '/' . $file);
                      if (is_string($value)) {
                          $cgroup[$key] = trim($value);
                      }
                  }
              }

              $counts = [
                  'visible_total' => 0,
                  'visible_node' => 0,
                  'visible_lsnode' => 0,
                  'visible_lshttpd' => 0,
                  'user_total' => 0,
                  'user_node' => 0,
                  'user_lsnode' => 0,
              ];
              $userNodeProcesses = [];
              foreach (glob('/proc/[0-9]*', GLOB_ONLYDIR) ?: [] as $procDir) {
                  $pid = (int) basename($procDir);
                  if ($pid <= 0) {
                      continue;
                  }
                  $comm = trim((string) @file_get_contents($procDir . '/comm'));
                  if ($comm === '') {
                      continue;
                  }
                  $counts['visible_total']++;
                  $commLower = strtolower($comm);
                  if ($commLower === 'node') {
                      $counts['visible_node']++;
                  }
                  if ($commLower === 'lsnode' || str_starts_with($commLower, 'lsnode')) {
                      $counts['visible_lsnode']++;
                  }
                  if (str_contains($commLower, 'lshttpd')) {
                      $counts['visible_lshttpd']++;
                  }

                  $statusText = (string) @file_get_contents($procDir . '/status');
                  $procUid = null;
                  if (preg_match('/^Uid:\s+(\d+)/m', $statusText, $uidMatch)) {
                      $procUid = (int) $uidMatch[1];
                  }
                  if (!is_int($uid) || $procUid !== $uid) {
                      continue;
                  }
                  $counts['user_total']++;
                  $isNode = $commLower === 'node';
                  $isLsnode = $commLower === 'lsnode' || str_starts_with($commLower, 'lsnode');
                  if ($isNode) {
                      $counts['user_node']++;
                  }
                  if ($isLsnode) {
                      $counts['user_lsnode']++;
                  }
                  if (($isNode || $isLsnode) && count($userNodeProcesses) < 20) {
                      $statusPpid = 0;
                      if (preg_match('/^PPid:\s+(\d+)/m', $statusText, $ppidMatch)) {
                          $statusPpid = (int) $ppidMatch[1];
                      }
                      $cwd = @readlink($procDir . '/cwd');
                      $exe = @readlink($procDir . '/exe');
                      $userNodeProcesses[] = [
                          'pid' => $pid,
                          'ppid' => $statusPpid,
                          'comm' => $comm,
                          'cwd' => is_string($cwd) ? $cwd : null,
                          'exe' => is_string($exe) ? $exe : null,
                      ];
                  }
              }

              $lsnodeCandidates = [];
              foreach ([
                  '/usr/local/lsws/fcgi-bin/lsnode',
                  '/usr/local/lsws/bin/lsnode',
                  '/usr/local/lsws/lsnode',
              ] as $candidate) {
                  $lsnodeCandidates[$candidate] = $fileState($candidate);
              }

              $lshttpdPath = '/usr/local/lsws/bin/lshttpd';
              $lshttpdVersion = null;
              if (is_executable($lshttpdPath)) {
                  $versionResult = $run([$lshttpdPath, '-v']);
                  if ($versionResult['exit'] === 0 && $versionResult['stdout'] !== '') {
                      $lshttpdVersion = substr(preg_replace('/\s+/', ' ', $versionResult['stdout']), 0, 500);
                  }
              }

              $cagefsProbe = null;
              if ($cagefsBin !== null) {
                  $probe = $run([
                      $cagefsBin,
                      '/bin/bash',
                      '-lc',
                      'printf "lsws_dir="; if test -d /usr/local/lsws; then echo yes; else echo no; fi; printf "lshttpd_exec="; if test -x /usr/local/lsws/bin/lshttpd; then echo yes; else echo no; fi; printf "lsnode_fcgi_exec="; if test -x /usr/local/lsws/fcgi-bin/lsnode; then echo yes; else echo no; fi; printf "selector_exec="; if test -x /usr/sbin/cloudlinux-selector || test -x /usr/bin/cloudlinux-selector; then echo yes; else echo no; fi'
                  ], $home);
                  $cagefsProbe = [
                      'exit' => $probe['exit'],
                      'stdout' => $probe['stdout'],
                  ];
              }

              $packages = null;
              if (is_executable('/usr/bin/rpm')) {
                  $rpm = $run(['/usr/bin/rpm', '-q', 'cagefs', 'lvemanager', 'lve-utils', 'lsws', 'alt-mod-passenger']);
                  $packages = [
                      'exit' => $rpm['exit'],
                      'stdout' => $rpm['stdout'],
                  ];
              }

              $toolAvailability = [];
              foreach ([
                  '/usr/bin/lveps', '/usr/sbin/lveps', '/usr/bin/lveinfo', '/usr/sbin/lveinfo',
                  '/usr/sbin/lvectl', '/usr/sbin/cagefsctl', '/usr/local/lsws/admin/misc/enable_ruby_python_selector.sh',
              ] as $tool) {
                  $toolAvailability[$tool] = $fileState($tool);
              }

              echo json_encode([
                  'ok' => true,
                  'identity' => ['user' => $user, 'uid' => $uid, 'gid' => $gid],
                  'web' => [
                      'root' => $webRoot,
                      'root_realpath' => realpath($webRoot) ?: null,
                      'release_file_sha' => $releaseSha,
                      'root_state' => $fileState($webRoot),
                      'tmp_state' => $fileState($webRoot . '/tmp'),
                      'restart_marker_state' => $fileState($webRoot . '/tmp/restart.txt'),
                      'server_js_state' => $fileState($webRoot . '/server.js'),
                      'startup_cjs_state' => $fileState($webRoot . '/startup.cjs'),
                      'htaccess_state' => $fileState($htaccessPath),
                      'passenger_directives' => array_slice($htaccess, 0, 20),
                  ],
                  'selector' => $selector,
                  'limits' => $limits,
                  'cgroup' => $cgroup,
                  'process_counts' => $counts,
                  'user_node_processes' => $userNodeProcesses,
                  'litespeed' => [
                      'root_state' => $fileState('/usr/local/lsws'),
                      'lshttpd_state' => $fileState($lshttpdPath),
                      'lshttpd_version' => $lshttpdVersion,
                      'lsnode_candidates' => $lsnodeCandidates,
                      'selector_enable_script' => $fileState('/usr/local/lsws/admin/misc/enable_ruby_python_selector.sh'),
                  ],
                  'cagefs_probe' => $cagefsProbe,
                  'package_probe' => $packages,
                  'tool_availability' => $toolAvailability,
                  'proc_loadavg' => trim((string) @file_get_contents('/proc/loadavg')),
              ], JSON_UNESCAPED_SLASHES | JSON_PRETTY_PRINT);
          } catch (Throwable $e) {
              http_response_code(500);
              echo json_encode(['ok' => false, 'error' => 'diagnostic_failed']);
          }
          PHP

          sed -i -e "s|__TOKEN_FILE__|$token_file|g" /tmp/modrik-node-diag.php
          {
            echo "REMOTE_DIAG_BRIDGE=$bridge"
            echo "REMOTE_DIAG_TOKEN_FILE=$token_file"
          } >> "$GITHUB_ENV"

      - name: Upload one-shot diagnostic over FTPS
        shell: bash
        run: |
          set -euo pipefail
          lftp -u "$FTP_USER","$FTP_PASSWORD" -p 21 "$FTP_HOST" -e "
            set cmd:fail-exit yes;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate yes;
            set ssl:check-hostname no;
            set ftp:passive-mode true;
            set net:max-retries 2;
            set net:timeout 20;
            put /tmp/modrik-node-diag-token -o $REMOTE_DIAG_TOKEN_FILE;
            put /tmp/modrik-node-diag.php -o $REMOTE_DIAG_BRIDGE;
            bye;
          "

      - name: Execute read-only LiteSpeed host-runtime diagnostic at cPanel origin
        shell: bash
        run: |
          set -euo pipefail
          token="$(cat /tmp/modrik-node-diag-token)"
          body="$RUNNER_TEMP/modrik-node-runtime-diagnostic.json"
          http_code="$(curl --silent --show-error \
            --output "$body" \
            --write-out '%{http_code}' \
            --max-time 50 \
            --resolve "$BRIDGE_HOST:443:$BRIDGE_ORIGIN_IP" \
            -H "X-MODRIK-Diag-Token: $token" \
            "$BRIDGE_URL/$REMOTE_DIAG_BRIDGE")"
          echo "diagnostic_http_status=$http_code"
          jq . "$body"
          jq -e '.ok == true' "$body" >/dev/null

          public_body="$RUNNER_TEMP/modrik-demo-public.html"
          curl --fail --silent --show-error --max-time 20 \
            -H 'Cache-Control: no-cache, no-store, max-age=0' \
            "https://$DEMO_HOST/?modrik_runtime_diag=${GITHUB_SHA::12}" > "$public_body"
          observed_sha="$(grep -oE 'MODRIK deployed release: [0-9a-f]{40}' "$public_body" | head -n1 | awk '{print $4}' || true)"
          echo "MODRIK_DEMO_OBSERVED_RENDERED_RELEASE=${observed_sha:-unknown}"
          printf '%s\n' "${observed_sha:-unknown}" > "$RUNNER_TEMP/modrik-observed-rendered-release.txt"

      - name: Publish sanitized diagnostic evidence to Issue 260
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/modrik-node-runtime-diagnostic.json"
          observed_file="$RUNNER_TEMP/modrik-observed-rendered-release.txt"
          observed_sha='unknown'
          [[ -f "$observed_file" ]] && observed_sha="$(cat "$observed_file")"

          if [[ -f "$body" ]] && jq -e '.ok == true' "$body" >/dev/null 2>&1; then
            safe_json="$(jq -c '{identity,web,selector,limits,cgroup,process_counts,user_node_processes,litespeed,cagefs_probe,package_probe,tool_availability,proc_loadavg}' "$body")"
            status='COMPLETED'
          else
            safe_json='{"diagnostic_result":"unavailable"}'
            status='FAILED_OR_INCOMPLETE'
          fi

          gh issue comment 260 --repo "$GITHUB_REPOSITORY" --body "DEMO LITESPEED HOST-RUNTIME DIAGNOSTIC $status\n\n- run: \`$GITHUB_RUN_ID\`\n- source main: \`$GITHUB_SHA\`\n- rendered public release: \`$observed_sha\`\n- run URL: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\n\nSanitized read-only server evidence (no environment variables, credentials, cookies, request bodies or arbitrary unrelated process arguments):\n\n\`\`\`json\n$safe_json\n\`\`\`"

      - name: Remove one-shot diagnostic files
        if: always()
        shell: bash
        run: |
          set +e
          [[ -n "${FTP_USER:-}" && -n "${FTP_PASSWORD:-}" ]] || exit 0
          timeout 45 lftp -u "$FTP_USER","$FTP_PASSWORD" -p 21 "$FTP_HOST" -e "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate yes;
            set ssl:check-hostname no;
            set ftp:passive-mode true;
            set net:max-retries 1;
            set net:timeout 10;
            rm -f ${REMOTE_DIAG_TOKEN_FILE:-.missing};
            rm -f ${REMOTE_DIAG_BRIDGE:-.missing};
            bye;
          "
          exit 0
