name: Diagnostic Pint 360

on:
  push:
    branches:
      - issue-360-parent-analytics

jobs:
  pint-diff:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Print exact Pint diff
        run: |
          vendor/bin/pint app/Services/ParentAnalyticsService.php
          git diff -- app/Services/ParentAnalyticsService.php
